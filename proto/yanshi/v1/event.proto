syntax = "proto3";

// Package yanshi.v1 定义 Session Event 日志的契约。
// Event 是 Session 与 Run 状态的唯一事实源（ADR-0004），
// 同时用于存储与跨端传输，修改须保持向后兼容（buf breaking）。
package yanshi.v1;

import "google/protobuf/timestamp.proto";

option go_package = "yanshi/gen/yanshi/v1;yanshiv1";

// Event 是 Session 日志中只追加、不可修改的一条记录。
message Event {
  // 全局唯一 ID。
  string id = 1;
  string session_id = 2;
  // 由日志分配，Session 内从 1 开始连续递增。
  uint64 seq = 3;
  google.protobuf.Timestamp time = 4;

  oneof payload {
    SessionCreated session_created = 10;
    RunRequested run_requested = 11;
    Steered steered = 12;
    AttemptStarted attempt_started = 13;
    AssistantMessage assistant_message = 14;
    ToolCallStarted tool_call_started = 15;
    ToolResult tool_result = 16;
    RunCompleted run_completed = 17;
    RunFailed run_failed = 18;
    RunInterrupted run_interrupted = 19;
    RunSuspended run_suspended = 20;
    ApprovalRequested approval_requested = 21;
    ApprovalDecided approval_decided = 22;
    ContextCompacted context_compacted = 23;
    SessionClosed session_closed = 24;
    MemoryRecalled memory_recalled = 25;
    AgentSwitched agent_switched = 26;
    ContentModerated content_moderated = 27;
    CallStarted call_started = 28;
    CallTranscript call_transcript = 29;
    CallEnded call_ended = 30;
    DecisionMade decision_made = 31;
    BackgroundCancelled background_cancelled = 32;
    CaptureAppended capture_appended = 33;
  }
}

// DecisionMade 记录一次判断（docs/design/m6-decisions.md，ADR-0030）：对"给定状态、有限选项"的问题由规则、小模型或
// LLM 作出的选择。先写日志再据此行动，重放时读日志而不重新判断。不含被判断的原文（ADR-0015）。
message DecisionMade {
  string run_id = 1;
  uint32 attempt = 2;
  // kind 是判断点，如 "tool_result_injection"。
  string kind = 3;
  // subject 是被判断的对象，如调用 ID。
  string subject = 4;
  repeated string options = 5;
  // chosen 是选中的选项；为空表示判断不可用，走默认路径。
  string chosen = 6;
  float confidence = 7;
  // model 是作出判断的规则集或模型，如 "rules/v1"、"local/qwen3-0.8b"。
  string model = 8;
  // shadow 为 true 时只记录、不影响执行（影子模式）。
  bool shadow = 9;
}

// ContentBlock 承载一段多模态内容。
message ContentBlock {
  oneof kind {
    Text text = 1;
    Media media = 2;
    UIContext ui_context = 3;
    // card 只出现在 show_card 的结果中（由平台校验后写入），card_action 只出现在用户输入中。
    Card card = 4;
    CardAction card_action = 5;
    // background_result 只由平台写入，是 RunRequested / Steered 中唯一的内容块（后台调用的了结，ADR-0035）。
    BackgroundResult background_result = 6;
    // capture 只出现在 captures 工具的结果中（由平台从日志读出写入，docs/design/captures.md §5）：说话人是结构化字段，
    // Memory 写入闸门与注入判断据此区分佩戴者与他人的话，不解析给模型看的文本。
    CaptureSegment capture = 7;
  }
}

// BackgroundResult 是一个后台调用的了结（docs/design/m1-device-nodes.md §3，ADR-0035）：设备上线后返回的结果，或到截止时间
// 设备仍未返回。它作为一条输入送达：Session 有活跃 Run 时并入它（Steered），否则开启新 Run（RunRequested），由模型向用户
// 报告。只由平台写入（网关写设备结果，Worker 写到期），用户提交的输入中带它会被拒绝；内容是设备返回的不可信数据。
message BackgroundResult {
  string call_id = 1;
  // 模型看到的工具名，如 "phone__take_photo"。
  string capability = 2;
  // 设备返回的内容；reason 为 "timeout" 时为空。
  repeated ContentBlock content = 3;
  bool is_error = 4;
  // "result"：设备返回了结果；"timeout"：到截止时间设备仍未返回，投递已撤回、调用没有执行。
  string reason = 5;
}

// Card 是 Agent 经内置工具 show_card 展示给用户的卡片：图文混排的内容，加上可点选的按钮、列表项与可填写的字段
// （docs/design/cards.md，ADR-0032）。卡片随 show_card 的结果写入日志；同一 card_id 再次展示时替换前一版，
// 客户端只显示最新版。卡片不阻塞 Run：需要等用户选择才能继续时用 ask_user。
message Card {
  // card_id 由模型指定或由平台按调用生成，在 Session 内标识一张卡片。
  string card_id = 1;
  // call_id 是展示这一版卡片的 show_card 调用：动作带上它，旧版本上的动作与新版本上的动作互不混淆。
  string call_id = 2;
  string title = 3;
  string subtitle = 4;
  // image 是头图：artifact://<id>（须属于本 Session）或 icon:<名称>（内置图标，见 card.Icons）。
  // 不允许外部地址：外部图片可以追踪用户，也不随 Session 删除。
  string image = 5;
  repeated CardElement body = 6;
  repeated CardButton buttons = 7;
}

message CardElement {
  oneof kind {
    // markdown 是 Markdown 文本（客户端只渲染安全的子集：不执行 HTML）。
    CardMarkdown markdown = 1;
    CardImage image = 2;
    CardFacts facts = 3;
    CardList list = 4;
    CardField field = 5;
  }
}

message CardMarkdown {
  string text = 1;
}

message CardImage {
  // uri 同 Card.image。
  string uri = 1;
  string alt = 2;
}

// CardFacts 是键值列表，如"时间 07:00""重复 工作日"。
message CardFacts {
  repeated CardFact facts = 1;
}

message CardFact {
  string label = 1;
  string value = 2;
}

message CardList {
  repeated CardListItem items = 1;
}

message CardListItem {
  string title = 1;
  string subtitle = 2;
  // image 同 Card.image。
  string image = 3;
  // action 非空时该项可点选，点选即执行这个动作（动作 ID）。
  string action = 4;
}

// CardField 是用户可以填写的字段；随按钮动作一起提交。
message CardField {
  string id = 1;
  string label = 2;
  // type 为 text（默认）、number、date（YYYY-MM-DD）、time（HH:MM）、select 或 toggle（"true"/"false"）。
  string type = 3;
  // options 是 select 的选项。
  repeated string options = 4;
  // value 是初始值。
  string value = 5;
  bool required = 6;
}

message CardButton {
  // id 是动作 ID，在卡片内唯一。
  string id = 1;
  string label = 2;
  // style 为 primary、default（默认）或 danger，只影响显示。
  string style = 3;
}

// CardAction 是用户在卡片上执行的动作（点按钮或点选列表项），作为一条输入提交：有进行中的 Run 时并入它，
// 否则开启新 Run。同一版卡片上的同一动作只生效一次（输入 ID 由平台按 call_id 与动作推导）。
message CardAction {
  string card_id = 1;
  string call_id = 2;
  string action = 3;
  // label 是动作的显示文字，由平台按卡片填写（客户端提交的值被忽略）。
  string label = 4;
  // values 是卡片上字段的填写值（字段 ID → 值），只含卡片声明过的字段。
  map<string, string> values = 5;
  // seq 是客户端收到这一版卡片的事件序号：平台据此直接读取卡片，而不必扫描日志。为 0 或不符时扫描日志。
  uint64 seq = 6;
}

// UIContext 是用户提交输入时所在界面的上下文，由 HostApp 附在输入上（docs/design/m3-duplex-channel.md §8），
// 帮助模型理解"这个""这里"指什么。内容可能来自第三方（正在看的网页、别人发来的消息），按不可信数据对待。
// 每条输入至多一个；各字段有长度上限（service.MaxUIContext*）。
message UIContext {
  // HostApp 中的界面，如 "订单详情"。
  string screen = 1;
  // 界面对应的业务对象或链接，如 "order://A1029"。
  string ref = 2;
  // 用户选中的文字。
  string selection = 3;
  // 界面上与输入相关的可见内容，由 HostApp 摘录。
  string content = 4;
  // 用户发这条输入时所在的设备（标签），由平台填写：经 Connection 提交时是这条连接的设备，否则是最近在前台使用的
  // 设备。同一能力有多台设备可选时，模型据此消解歧义（docs/design/m6-decisions.md §3）。
  string device = 5;
}

message Text {
  string text = 1;
}

// Media 是非文本内容，以 uri 引用 Artifact（"artifact://<id>"）。data 只在发给模型的请求副本中填入（Worker 内联图片），
// 不进日志：用户输入中带 data 或其他地址的 Media 被拒绝（docs/design/m2-artifacts.md）。
message Media {
  string mime_type = 1;
  string uri = 2;
  bytes data = 3;
  // 文件名与字节数，供展示与模型理解。
  string name = 4;
  uint64 size = 5;
}

message AgentRef {
  string name = 1;
  string version = 2;
}

// SessionCreated 总是 Session 的第一个事件；AgentDef 版本在此固定。
message SessionCreated {
  string business_line = 1;
  string end_user = 2;
  AgentRef agent = 3;
  // 非空表示这是委托派生的子 Session（docs/design/m5-multi-agent.md）：子 Run 的终态作为父调用的结果。
  ParentRef parent = 4;
}

// ParentRef 是子 Session 的来处：父 Session 中的哪个 Run、哪次调用派生了它。
message ParentRef {
  string session_id = 1;
  string run_id = 2;
  string call_id = 3;
  // 祖先的 AgentDef，由近及远（第一个是父 Session 的）。子 Run 的能力是自身白名单与每个祖先白名单的交集；
  // 委托深度等于它的长度。
  repeated AgentRef ancestors = 4;
}

// AgentSwitched 把 Session 当前使用的 AgentDef 换成同名的另一个版本，只发生在两个 Run 之间
// （docs/design/m4-agent-rollout.md §4，ADR-0020）。reason 如 "withdrawn"。
message AgentSwitched {
  AgentRef from = 1;
  AgentRef to = 2;
  string reason = 3;
}

// ContentModerated 记录一轮模型输出被内容安全拦截（docs/design/m4-moderation.md，ADR-0021）。
// 不含原文：与它同批提交的 AssistantMessage 是替换后的拒答文本，且没有调用。
message ContentModerated {
  string run_id = 1;
  uint32 attempt = 2;
  // stage 目前只有 "output"（输入被拦截时不写日志）。
  string stage = 3;
  repeated string labels = 4;
}

// RunRequested 在 Session 无活跃 Run 时由用户输入触发。
message RunRequested {
  string run_id = 1;
  repeated ContentBlock input = 2;
  // 客户端为这条输入生成的 ID（可为空）：同一 ID 的重复提交返回首次的结果而不再写入（docs/design/m3-duplex-channel.md §5）。
  string input_id = 3;
  // 非空表示输入由该 Call 中的语音模型派生（run_task，docs/design/m3-call.md §5）：结果会被朗读。
  string from_call = 4;
}

// Steered 是活跃 Run 进行中的追加输入，不改变 Run 状态。
message Steered {
  string run_id = 1;
  repeated ContentBlock input = 2;
  // 客户端为这条输入生成的 ID（可为空）：同一 ID 的重复提交返回首次的结果而不再写入（docs/design/m3-duplex-channel.md §5）。
  string input_id = 3;
  // 同 RunRequested.from_call。
  string from_call = 4;
}

// AttemptStarted 标志某个 Worker 开始（或接管）执行 Run；attempt 是 fencing 令牌。
message AttemptStarted {
  string run_id = 1;
  uint32 attempt = 2;
  string worker_id = 3;
  // live_endpoint 是执行该 Attempt 的进程的内部地址，其他进程从这里拉取实时增量（ADR-0013）；
  // 为空表示增量只在本进程内可见。不对客户端暴露。
  string live_endpoint = 4;
}

message ToolCall {
  string call_id = 1;
  string capability = 2;
  // JSON 对象。
  string arguments_json = 3;
}

message Usage {
  uint64 input_tokens = 1;
  uint64 output_tokens = 2;
  // input_tokens 中命中提供商前缀缓存的部分（价格通常远低于普通输入），用于计量与观察缓存命中率。
  uint64 cached_input_tokens = 3;
  // output_tokens 中用于思考的部分（提供商报告时才有）。
  uint64 reasoning_tokens = 4;
}

// AssistantMessage 是一次完整的模型输出；tool_calls 即 Capability 调用请求。
message AssistantMessage {
  string run_id = 1;
  uint32 attempt = 2;
  repeated ContentBlock content = 3;
  repeated ToolCall tool_calls = 4;
  string model = 5;
  Usage usage = 6;
  // reasoning 是模型的思考过程（提供商流式给出时才有，ADR-0034）：给人看，不再发回给模型；与回复一样在写日志之前
  // 做内容安全检查，随 Session 删除。
  string reasoning = 7;
  // duration_ms 是这次模型调用的耗时（含提供商层的重试），first_token_ms 是到第一段输出（思考或正文）的时间；
  // 由 Worker 按 clock.Clock 计时，只用于观察。
  uint32 duration_ms = 8;
  uint32 first_token_ms = 9;
  // finish_reason 是提供商给出的结束原因，如 "stop"、"tool_calls"、"length"。
  string finish_reason = 10;
}

// ToolCallStarted 在执行 Capability 之前落盘，用于故障恢复时判断调用是否可能已产生副作用。
// node_id 非空表示路由调用：已派发到该 Node 的 Inbox，结果异步返回（见 m1 设计 §3）。
message ToolCallStarted {
  string run_id = 1;
  uint32 attempt = 2;
  string call_id = 3;
  string node_id = 4;
  // 路由调用的结果截止时间。
  google.protobuf.Timestamp deadline = 5;
}

message ToolResult {
  string run_id = 1;
  // 0 表示由网关追加的路由调用结果，不受 Attempt fencing。
  uint32 attempt = 2;
  string call_id = 3;
  repeated ContentBlock content = 4;
  bool is_error = 5;
  // 用户直接打字回答 ask_user 提问时，这条输入的 ID（见 RunRequested.input_id）。
  string input_id = 6;
  // 非空表示这条回答由该 Call 中的语音模型转述（run_task 恰好回答了提问）：不是用户的原话（Memory 写入闸门）。
  string from_call = 7;
  // 用户等回答时在卡片上点了动作、这条回答由它而来时，是平台核对、规范化后的动作（与 RunRequested、Steered 输入中的
  // 相同，见 docs/design/cards.md §4）。客户端据此把该动作显示为已选：这条输入没有写成 RunRequested 或 Steered，
  // 只看输入的话各设备都看不到它已执行，再点却得到 duplicate。只由平台写入，模型看不到这个字段（它看的是 content）。
  CardAction card_action = 8;
  // 非空表示调用转入后台（ADR-0035）：路由到设备的调用已派发、设备离线超过宽限期，Worker 不再等待。content 是交给模型的
  // 占位说明，调用在 Session 级继续等待设备，结果或到期之后作为一条输入（BackgroundResult）送达。只由 Worker 写入。
  Backgrounded backgrounded = 9;
}

message Backgrounded {
  string node_id = 1;
  // 后台调用的截止时间：转入后台时起算的后台时限。
  google.protobuf.Timestamp deadline = 2;
}

// BackgroundCancelled 记录用户取消了一个未了结的后台调用（ADR-0035）：投递随之撤回，设备上线后不再执行。它不开启新 Run，
// 在模型上下文中呈现为一条说明。
message BackgroundCancelled {
  string call_id = 1;
  // 模型看到的工具名（由平台按投影填写）。
  string capability = 2;
  // 取消方，如设备 ID 或 "end_user:<id>"。
  string by = 3;
}

message RunCompleted {
  string run_id = 1;
  uint32 attempt = 2;
}

message RunFailed {
  string run_id = 1;
  uint32 attempt = 2;
  string reason = 3;
}

message RunInterrupted {
  string run_id = 1;
  // 主动中断方，如 "user"。
  string by = 2;
}

// RunSuspended 表示当前 Attempt 正常结束、Run 等待外部条件；从 suspended 恢复不计为接管。
message RunSuspended {
  string run_id = 1;
  uint32 attempt = 2;
  // reason 为空表示等待审批或设备结果（由挂起的调用可知）；"end_user_quota" / "business_line_quota"
  // 表示配额用尽（docs/design/m4-quota-usage.md §3），until 为配额重置时间；"handoff" 表示移交给其他 Worker
  // （交互 Worker 移交长任务、优雅停机，ADR-0029），立即可恢复。
  string reason = 3;
  google.protobuf.Timestamp until = 4;
}

// ApprovalRequested 请求 EndUser 批准一次高风险调用。
message ApprovalRequested {
  string run_id = 1;
  uint32 attempt = 2;
  string call_id = 3;
  // 给用户看的说明，如 "在 macbook 上执行 send_message"。
  string summary = 4;
  google.protobuf.Timestamp deadline = 5;
}

// ApprovalDecided 是 EndUser 的审批决定（外部事件，不受 Attempt fencing）。
message ApprovalDecided {
  string run_id = 1;
  string call_id = 2;
  bool approved = 3;
  // 决定来源，如 Device 或 Node ID。
  string by = 4;
}

// ContextCompacted 记录一次上下文压缩（ADR-0012）：seq ≤ through_seq 的历史在模型上下文中由 summary 代替。
// through_seq 必须是闭合边界：此前请求的调用都已有结果。原始事件不删除。
message ContextCompacted {
  string run_id = 1;
  uint32 attempt = 2;
  uint64 through_seq = 3;
  repeated ContentBlock summary = 4;
  string model = 5;
  Usage usage = 6;
}

// SessionClosed 是 Session 的终态：之后不再接收任何输入与 Run 事件（docs/design/m2-session-lifecycle.md §2）。
// 关闭不可逆；对话与工件仍可查看，沙箱工作区随之销毁。
message SessionClosed {
  // 关闭方，如 "end_user:u1"、"service:demo"、"retention"。
  string by = 1;
  string reason = 2;
}

// MemoryRecalled 记录 Run 开始时召回的 Memory（ADR-0016）：只用于当前 Run 的上下文，
// 使接管与回放看到相同的上下文，同时也是 Memory 的访问记录。每个 Run 至多一次。
message MemoryRecalled {
  string run_id = 1;
  uint32 attempt = 2;
  repeated RecalledMemory items = 3;
}

message RecalledMemory {
  string id = 1;
  // 所属业务线：与 Session 的业务线不同时，表示经 Grant 读取。
  string business_line = 2;
  string category = 3;
  string content = 4;
  // 记录日期（当地，YYYY-MM-DD）：召回文本注明它，模型据此判断新旧（docs/design/m4-memory-grant.md §11）。
  string recorded_on = 5;
}

// CallStarted 表示 Session 中开始了一次 Call（全双工语音通话，docs/design/m3-call.md）。媒体流不进日志（ADR-0005），
// 只记录开始、双方每句话的转写与结束。一个 Session 同一时刻至多一个进行中的 Call。
message CallStarted {
  // 客户端生成，在 Session 内唯一。
  string call_id = 1;
  // 发起通话的设备（Hello.node_id）。
  string device_id = 2;
  // 实时语音模型引用（provider/model）与音色。
  string model = 3;
  string voice = 4;
}

// CallTranscript 是 Call 中一句话的转写，写入前经过内容安全检查（ADR-0021）。它进入对话上下文：
// 之后的 Run 与文字对话都能看到通话中说过什么。
message CallTranscript {
  string call_id = 1;
  // "user" 或 "assistant"。
  string role = 2;
  string text = 3;
  // 助手的话被用户打断：text 是打断前已生成的部分（不一定都播出了）。
  bool interrupted = 4;
}

// CaptureAppended 是 HostApp 提交的一批旁听转写（docs/design/captures.md，ADR-0036）：EndUser 与他人的日常对话，
// 不是对 Agent 说的话。它不开启 Run，也不进入对话上下文：Run 经 captures 工具按序号读取。写入前逐段经过内容安全检查。
message CaptureAppended {
  // HostApp 生成，在 Session 内唯一；重试时不变，按它去重（session.MaxRecentCaptures）。
  string capture_id = 1;
  repeated CaptureSegment segments = 2;
}

// CaptureSegment 是旁听转写中的一段话。
message CaptureSegment {
  // 说话人由 HostApp 的声纹区分给出，yanshi 无法验证：佩戴者的话按 EndUser 本人的输入对待，他人的话按外部内容对待。
  Speaker speaker = 1;
  // speaker_key 区分同一批中的不同他人（如 "other-1"），只在本批内有意义；佩戴者为空。
  string speaker_key = 2;
  // 未通过内容安全时为空（redacted），只留占位。
  string text = 3;
  bool redacted = 4;
  // 设备时钟下说这段话的时间，只供展示，不用于排序：顺序以日志为准。
  google.protobuf.Timestamp spoken_at = 5;
  // time_zone 是说这段话时手机所在的 IANA 时区（如 "Asia/Shanghai"），由 HostApp 填写。与 spoken_at 都有时，整理时显示
  // 当地的日期与时刻，模型据此按停顿分开不同的对话、把"明天""周五"换算成日期；为空时不显示时间。
  string time_zone = 6;
}

enum Speaker {
  SPEAKER_UNSPECIFIED = 0;
  // 佩戴外设的 EndUser 本人。
  SPEAKER_WEARER = 1;
  // EndUser 以外的人。
  SPEAKER_OTHER = 2;
}

// CallEnded 表示 Call 结束。
message CallEnded {
  string call_id = 1;
  // "hangup"（用户挂断）、"disconnected"（连接断开）、"provider"（实时模型结束或出错）、
  // "replaced"（同一 Session 开始了新的 Call）、"session_closed"、"quota"、"error"。
  string reason = 2;
}
