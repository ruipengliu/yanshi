syntax = "proto3";

// Package yanshi.v1 定义 Session Event 日志的契约。
// Event 是 Session 与 Run 状态的唯一事实源（ADR-0004），
// 同时用于存储与跨端传输，修改须保持向后兼容（buf breaking）。
package yanshi.v1;

import "google/protobuf/timestamp.proto";

option go_package = "yanshi/gen/yanshi/v1;yanshiv1";

// Event 是 Session 日志中只追加、不可修改的一条记录。
message Event {
  // 全局唯一 ID。
  string id = 1;
  string session_id = 2;
  // 由日志分配，Session 内从 1 开始连续递增。
  uint64 seq = 3;
  google.protobuf.Timestamp time = 4;

  oneof payload {
    SessionCreated session_created = 10;
    RunRequested run_requested = 11;
    Steered steered = 12;
    AttemptStarted attempt_started = 13;
    AssistantMessage assistant_message = 14;
    ToolCallStarted tool_call_started = 15;
    ToolResult tool_result = 16;
    RunCompleted run_completed = 17;
    RunFailed run_failed = 18;
    RunInterrupted run_interrupted = 19;
    RunSuspended run_suspended = 20;
    ApprovalRequested approval_requested = 21;
    ApprovalDecided approval_decided = 22;
    ContextCompacted context_compacted = 23;
    SessionClosed session_closed = 24;
    MemoryRecalled memory_recalled = 25;
    AgentSwitched agent_switched = 26;
    ContentModerated content_moderated = 27;
    CallStarted call_started = 28;
    CallTranscript call_transcript = 29;
    CallEnded call_ended = 30;
  }
}

// ContentBlock 承载一段多模态内容。
message ContentBlock {
  oneof kind {
    Text text = 1;
    Media media = 2;
    UIContext ui_context = 3;
  }
}

// UIContext 是用户提交输入时所在界面的上下文，由 HostApp 附在输入上（docs/design/m3-duplex-channel.md §8），
// 帮助模型理解"这个""这里"指什么。内容可能来自第三方（正在看的网页、别人发来的消息），按不可信数据对待。
// 每条输入至多一个；各字段有长度上限（service.MaxUIContext*）。
message UIContext {
  // HostApp 中的界面，如 "订单详情"。
  string screen = 1;
  // 界面对应的业务对象或链接，如 "order://A1029"。
  string ref = 2;
  // 用户选中的文字。
  string selection = 3;
  // 界面上与输入相关的可见内容，由 HostApp 摘录。
  string content = 4;
}

message Text {
  string text = 1;
}

// Media 是非文本内容，以 uri 引用 Artifact（"artifact://<id>"）。data 只在发给模型的请求副本中填入（Worker 内联图片），
// 不进日志：用户输入中带 data 或其他地址的 Media 被拒绝（docs/design/m2-artifacts.md）。
message Media {
  string mime_type = 1;
  string uri = 2;
  bytes data = 3;
  // 文件名与字节数，供展示与模型理解。
  string name = 4;
  uint64 size = 5;
}

message AgentRef {
  string name = 1;
  string version = 2;
}

// SessionCreated 总是 Session 的第一个事件；AgentDef 版本在此固定。
message SessionCreated {
  string business_line = 1;
  string end_user = 2;
  AgentRef agent = 3;
}

// AgentSwitched 把 Session 当前使用的 AgentDef 换成同名的另一个版本，只发生在两个 Run 之间
// （docs/design/m4-agent-rollout.md §4，ADR-0020）。reason 如 "withdrawn"。
message AgentSwitched {
  AgentRef from = 1;
  AgentRef to = 2;
  string reason = 3;
}

// ContentModerated 记录一轮模型输出被内容安全拦截（docs/design/m4-moderation.md，ADR-0021）。
// 不含原文：与它同批提交的 AssistantMessage 是替换后的拒答文本，且没有调用。
message ContentModerated {
  string run_id = 1;
  uint32 attempt = 2;
  // stage 目前只有 "output"（输入被拦截时不写日志）。
  string stage = 3;
  repeated string labels = 4;
}

// RunRequested 在 Session 无活跃 Run 时由用户输入触发。
message RunRequested {
  string run_id = 1;
  repeated ContentBlock input = 2;
  // 客户端为这条输入生成的 ID（可为空）：同一 ID 的重复提交返回首次的结果而不再写入（docs/design/m3-duplex-channel.md §5）。
  string input_id = 3;
  // 非空表示输入由该 Call 中的语音模型派生（run_task，docs/design/m3-call.md §5）：结果会被朗读。
  string from_call = 4;
}

// Steered 是活跃 Run 进行中的追加输入，不改变 Run 状态。
message Steered {
  string run_id = 1;
  repeated ContentBlock input = 2;
  // 客户端为这条输入生成的 ID（可为空）：同一 ID 的重复提交返回首次的结果而不再写入（docs/design/m3-duplex-channel.md §5）。
  string input_id = 3;
  // 同 RunRequested.from_call。
  string from_call = 4;
}

// AttemptStarted 标志某个 Worker 开始（或接管）执行 Run；attempt 是 fencing 令牌。
message AttemptStarted {
  string run_id = 1;
  uint32 attempt = 2;
  string worker_id = 3;
  // live_endpoint 是执行该 Attempt 的进程的内部地址，其他进程从这里拉取实时增量（ADR-0013）；
  // 为空表示增量只在本进程内可见。不对客户端暴露。
  string live_endpoint = 4;
}

message ToolCall {
  string call_id = 1;
  string capability = 2;
  // JSON 对象。
  string arguments_json = 3;
}

message Usage {
  uint64 input_tokens = 1;
  uint64 output_tokens = 2;
  // input_tokens 中命中提供商前缀缓存的部分（价格通常远低于普通输入），用于计量与观察缓存命中率。
  uint64 cached_input_tokens = 3;
}

// AssistantMessage 是一次完整的模型输出；tool_calls 即 Capability 调用请求。
message AssistantMessage {
  string run_id = 1;
  uint32 attempt = 2;
  repeated ContentBlock content = 3;
  repeated ToolCall tool_calls = 4;
  string model = 5;
  Usage usage = 6;
}

// ToolCallStarted 在执行 Capability 之前落盘，用于故障恢复时判断调用是否可能已产生副作用。
// node_id 非空表示路由调用：已派发到该 Node 的 Inbox，结果异步返回（见 m1 设计 §3）。
message ToolCallStarted {
  string run_id = 1;
  uint32 attempt = 2;
  string call_id = 3;
  string node_id = 4;
  // 路由调用的结果截止时间。
  google.protobuf.Timestamp deadline = 5;
}

message ToolResult {
  string run_id = 1;
  // 0 表示由网关追加的路由调用结果，不受 Attempt fencing。
  uint32 attempt = 2;
  string call_id = 3;
  repeated ContentBlock content = 4;
  bool is_error = 5;
  // 用户直接打字回答 ask_user 提问时，这条输入的 ID（见 RunRequested.input_id）。
  string input_id = 6;
  // 非空表示这条回答由该 Call 中的语音模型转述（run_task 恰好回答了提问）：不是用户的原话（Memory 写入闸门）。
  string from_call = 7;
}

message RunCompleted {
  string run_id = 1;
  uint32 attempt = 2;
}

message RunFailed {
  string run_id = 1;
  uint32 attempt = 2;
  string reason = 3;
}

message RunInterrupted {
  string run_id = 1;
  // 主动中断方，如 "user"。
  string by = 2;
}

// RunSuspended 表示当前 Attempt 正常结束、Run 等待外部条件；从 suspended 恢复不计为接管。
message RunSuspended {
  string run_id = 1;
  uint32 attempt = 2;
  // reason 为空表示等待审批或设备结果（由挂起的调用可知）；"end_user_quota" / "business_line_quota"
  // 表示配额用尽（docs/design/m4-quota-usage.md §3），until 为配额重置时间；"handoff" 表示移交给其他 Worker
  // （交互 Worker 移交长任务、优雅停机，ADR-0029），立即可恢复。
  string reason = 3;
  google.protobuf.Timestamp until = 4;
}

// ApprovalRequested 请求 EndUser 批准一次高风险调用。
message ApprovalRequested {
  string run_id = 1;
  uint32 attempt = 2;
  string call_id = 3;
  // 给用户看的说明，如 "在 macbook 上执行 send_message"。
  string summary = 4;
  google.protobuf.Timestamp deadline = 5;
}

// ApprovalDecided 是 EndUser 的审批决定（外部事件，不受 Attempt fencing）。
message ApprovalDecided {
  string run_id = 1;
  string call_id = 2;
  bool approved = 3;
  // 决定来源，如 Device 或 Node ID。
  string by = 4;
}

// ContextCompacted 记录一次上下文压缩（ADR-0012）：seq ≤ through_seq 的历史在模型上下文中由 summary 代替。
// through_seq 必须是闭合边界：此前请求的调用都已有结果。原始事件不删除。
message ContextCompacted {
  string run_id = 1;
  uint32 attempt = 2;
  uint64 through_seq = 3;
  repeated ContentBlock summary = 4;
  string model = 5;
  Usage usage = 6;
}

// SessionClosed 是 Session 的终态：之后不再接收任何输入与 Run 事件（docs/design/m2-session-lifecycle.md §2）。
// 关闭不可逆；对话与工件仍可查看，沙箱工作区随之销毁。
message SessionClosed {
  // 关闭方，如 "end_user:u1"、"service:demo"、"retention"。
  string by = 1;
  string reason = 2;
}

// MemoryRecalled 记录 Run 开始时召回的 Memory（ADR-0016）：只用于当前 Run 的上下文，
// 使接管与回放看到相同的上下文，同时也是 Memory 的访问记录。每个 Run 至多一次。
message MemoryRecalled {
  string run_id = 1;
  uint32 attempt = 2;
  repeated RecalledMemory items = 3;
}

message RecalledMemory {
  string id = 1;
  // 所属业务线：与 Session 的业务线不同时，表示经 Grant 读取。
  string business_line = 2;
  string category = 3;
  string content = 4;
}

// CallStarted 表示 Session 中开始了一次 Call（全双工语音通话，docs/design/m3-call.md）。媒体流不进日志（ADR-0005），
// 只记录开始、双方每句话的转写与结束。一个 Session 同一时刻至多一个进行中的 Call。
message CallStarted {
  // 客户端生成，在 Session 内唯一。
  string call_id = 1;
  // 发起通话的设备（Hello.node_id）。
  string device_id = 2;
  // 实时语音模型引用（provider/model）与音色。
  string model = 3;
  string voice = 4;
}

// CallTranscript 是 Call 中一句话的转写，写入前经过内容安全检查（ADR-0021）。它进入对话上下文：
// 之后的 Run 与文字对话都能看到通话中说过什么。
message CallTranscript {
  string call_id = 1;
  // "user" 或 "assistant"。
  string role = 2;
  string text = 3;
  // 助手的话被用户打断：text 是打断前已生成的部分（不一定都播出了）。
  bool interrupted = 4;
}

// CallEnded 表示 Call 结束。
message CallEnded {
  string call_id = 1;
  // "hangup"（用户挂断）、"disconnected"（连接断开）、"provider"（实时模型结束或出错）、
  // "replaced"（同一 Session 开始了新的 Call）、"session_closed"、"quota"、"error"。
  string reason = 2;
}
