# capture-workday-oneshot 的旁听：morning、midday、evening 三份按顺序合在一起（评测调查用）。
- {speaker: "other", key: "he", text: "喂，你到地铁站了吗？", at: "2026-10-23 08:40", topic: "family"}
- {speaker: "wearer", text: "刚进站，人超级多。怎么了？", at: "2026-10-23 08:40", topic: "family"}
- {speaker: "other", key: "he", text: "朵朵刚才问我，周六钢琴课谁送她，我说问你。", at: "2026-10-23 08:41", topic: "family"}
- {speaker: "wearer", text: "周六上午是吧，几点来着，九点半？", at: "2026-10-23 08:42", topic: "family"}
- {speaker: "other", key: "he", text: "九点半开始，九点就得出门，那个琴行在万达三楼。", at: "2026-10-23 08:43", topic: "family"}
- {speaker: "wearer", text: "行，周六上午我送她去钢琴课，你在家睡个懒觉吧。", at: "2026-10-23 08:44", topic: "family", gold: "piano-send"}
- {speaker: "other", key: "he", text: "那我去接，十一点下课，接完带她去吃个午饭。", at: "2026-10-23 08:44", topic: "family", gold: "piano-pick"}
- {speaker: "wearer", text: "好，就这么定。哎你别又带她吃炸鸡啊。", at: "2026-10-23 08:45", topic: "family"}
- {speaker: "other", key: "he", text: "哈哈知道了知道了。还有晚饭，今天你几点回来？", at: "2026-10-23 08:46", topic: "family"}
- {speaker: "wearer", text: "不好说，今天客户那边有个会，可能七点多。", at: "2026-10-23 08:47", topic: "family"}
- {speaker: "other", key: "he", text: "那我先做饭，你回来热一下。", at: "2026-10-23 08:48", topic: "family", gold: "dinner"}
- {speaker: "wearer", text: "嗯好。哦对了，物业那个停车费你交了没有？", at: "2026-10-23 08:48", topic: "family"}
- {speaker: "other", key: "he", text: "还没，我中午用手机交。", at: "2026-10-23 08:49", topic: "family", gold: "parking"}
- {speaker: "wearer", text: "别忘了，上次就逾期了。", at: "2026-10-23 08:50", topic: "family"}
- {speaker: "other", key: "he", text: "不会不会。那你先忙，挂了啊。", at: "2026-10-23 08:51", topic: "family"}
- {speaker: "wearer", text: "嗯拜拜。", at: "2026-10-23 08:52", topic: "family"}
- {speaker: "other", key: "xu", text: "绿源那个合同法务改完了没有？", at: "2026-10-23 09:05"}
- {speaker: "other", key: "ma", text: "改完了，就差盖章，我明天把合同给客户寄过去。", at: "2026-10-23 09:06"}
- {speaker: "other", key: "xu", text: "寄顺丰啊，上次那个圆通丢了一份。", at: "2026-10-23 09:07"}
- {speaker: "other", key: "ma", text: "知道知道。你下午那个客户拜访几点？", at: "2026-10-23 09:08"}
- {speaker: "other", key: "xu", text: "三点，在滨江那边，开车得一个小时。", at: "2026-10-23 09:09"}
- {speaker: "other", key: "ma", text: "那你两点就得走。", at: "2026-10-23 09:10"}
- {speaker: "other", key: "xu", text: "嗯，对了，这个月的业绩你到多少了？", at: "2026-10-23 09:11"}
- {speaker: "other", key: "ma", text: "才百分之六十，月底估计够呛。", at: "2026-10-23 09:12"}
- {speaker: "other", key: "xu", text: "我也差不多，经理又要骂人了。", at: "2026-10-23 09:14"}
- {speaker: "other", key: "ma", text: "下周那个展会能签几个就好了。", at: "2026-10-23 09:15"}
- {speaker: "other", key: "xu", text: "展会的物料你准备了吗？", at: "2026-10-23 09:16"}
- {speaker: "other", key: "ma", text: "易拉宝还没做，我周一找设计。", at: "2026-10-23 09:17"}
- {speaker: "other", key: "xu", text: "小米她们最近忙首页改版，估计没空。", at: "2026-10-23 09:18"}
- {speaker: "other", key: "ma", text: "那我找外包吧。", at: "2026-10-23 09:19"}
- {speaker: "other", key: "xu", text: "你中午吃啥？", at: "2026-10-23 09:20"}
- {speaker: "other", key: "ma", text: "还没想，点外卖吧。", at: "2026-10-23 09:22"}
- {speaker: "wearer", text: "好，人齐了吧，我们快一点，十五分钟。先说 3.2，下周二发版还来得及吗？", at: "2026-10-23 09:30", topic: "release"}
- {speaker: "other", key: "chen", text: "后端这边接口都提测了，就剩那个批量排班模板，还有点问题，规则引擎那块跑得慢。", at: "2026-10-23 09:30", topic: "release"}
- {speaker: "wearer", text: "慢到什么程度？", at: "2026-10-23 09:31", topic: "release"}
- {speaker: "other", key: "chen", text: "五百人以上的门店，生成一次要四十多秒，客户肯定受不了。", at: "2026-10-23 09:31", topic: "release"}
- {speaker: "wearer", text: "那这个功能我们这次先不上了，放到 3.3。大家没意见吧？", at: "2026-10-23 09:32", topic: "release"}
- {speaker: "other", key: "wu", text: "我没意见，前端那个页面本来也还没联调完。", at: "2026-10-23 09:32", topic: "release"}
- {speaker: "other", key: "jie", text: "我也同意，不然测试也测不完。", at: "2026-10-23 09:33", topic: "release"}
- {speaker: "wearer", text: "好，那批量排班模板砍掉，放 3.3，我回头在需求池里改一下状态。", at: "2026-10-23 09:33", topic: "release", gold: "backlog"}
- {speaker: "wearer", text: "小吴，你那边呢？", at: "2026-10-23 09:34", topic: "release"}
- {speaker: "other", key: "wu", text: "我这边主要是那个排班导出的 bug，导出 Excel 的时候跨月的班次会错位。", at: "2026-10-23 09:34", topic: "release"}
- {speaker: "wearer", text: "这个客户投诉过两次了，必须这次修掉。", at: "2026-10-23 09:35", topic: "release"}
- {speaker: "other", key: "wu", text: "嗯，我已经定位到了，是时区转换的问题，今天下班前我把导出的 bug 修掉。", at: "2026-10-23 09:35", topic: "release", gold: "export-fix"}
- {speaker: "wearer", text: "好，修完直接提给阿杰。", at: "2026-10-23 09:36", topic: "release", gold: "export-fix"}
- {speaker: "other", key: "jie", text: "收到。那我这边回归测试的话，导出修完我再跑一遍全量。", at: "2026-10-23 09:36", topic: "release", gold: "regression"}
- {speaker: "wearer", text: "全量回归什么时候能跑完？", at: "2026-10-23 09:37", topic: "release"}
- {speaker: "other", key: "jie", text: "如果小吴今天能提测，周末我把自动化跑起来，周一下午之前回归测试能跑完。", at: "2026-10-23 09:37", topic: "release", gold: "regression"}
- {speaker: "wearer", text: "周一下午之前，可以。有问题第一时间在群里说。", at: "2026-10-23 09:38", topic: "release", gold: "regression"}
- {speaker: "other", key: "jie", text: "好的。", at: "2026-10-23 09:38", topic: "release"}
- {speaker: "other", key: "chen", text: "还有一个事，那个康宁的单点登录，他们之前提的 SSO，要不要这版做？", at: "2026-10-23 09:39", topic: "release"}
- {speaker: "wearer", text: "不做，那个我下午会跟康宁那边对一下优先级，看他们到底急不急。", at: "2026-10-23 09:39", topic: "release", gold: "sso-check"}
- {speaker: "other", key: "chen", text: "行，那我先不排了。", at: "2026-10-23 09:40", topic: "release"}
- {speaker: "wearer", text: "嗯。还有别的吗？没有的话——", at: "2026-10-23 09:40", topic: "release"}
- {speaker: "other", key: "wu", text: "哦对，设计那边首页改版的稿子，小米说下午评审，我要参加吗？", at: "2026-10-23 09:41", topic: "release"}
- {speaker: "wearer", text: "你要来，前端得评估工作量。两点，三楼小会议室。", at: "2026-10-23 09:41", topic: "release"}
- {speaker: "other", key: "wu", text: "好的。", at: "2026-10-23 09:42", topic: "release"}
- {speaker: "wearer", text: "还有，客服那边这周的反馈汇总我看了，排名前三的是导出错位、夜班补贴算错、还有 App 偶尔闪退。", at: "2026-10-23 09:42", topic: "release"}
- {speaker: "other", key: "jie", text: "闪退是安卓那个吧，我复现不了。", at: "2026-10-23 09:43", topic: "release"}
- {speaker: "other", key: "wu", text: "我看了崩溃日志，基本都是安卓八的机器，内存不够。", at: "2026-10-23 09:43", topic: "release"}
- {speaker: "wearer", text: "安卓八还有多少用户？", at: "2026-10-23 09:44", topic: "release"}
- {speaker: "other", key: "wu", text: "大概百分之六。", at: "2026-10-23 09:44", topic: "release"}
- {speaker: "wearer", text: "百分之六不少了，店长手机普遍旧。这个放到 3.3 里修，先记下来。", at: "2026-10-23 09:45", topic: "release"}
- {speaker: "other", key: "wu", text: "好的。", at: "2026-10-23 09:45", topic: "release"}
- {speaker: "other", key: "chen", text: "夜班补贴那个是规则配置的问题，客户自己配错了，不是 bug。", at: "2026-10-23 09:46", topic: "release"}
- {speaker: "wearer", text: "那客服要跟客户解释清楚，别让人家觉得是我们系统算错了。老陈你给客服写个说明。", at: "2026-10-23 09:46", topic: "release", gold: "chen-note"}
- {speaker: "other", key: "chen", text: "行，我写一个简单的说明发客服群。", at: "2026-10-23 09:47", topic: "release", gold: "chen-note"}
- {speaker: "wearer", text: "嗯。发版那天谁值班？", at: "2026-10-23 09:47", topic: "release"}
- {speaker: "other", key: "chen", text: "我和小吴，晚上十点发。", at: "2026-10-23 09:48", topic: "release", gold: "oncall"}
- {speaker: "wearer", text: "发完在群里报一下，有回滚预案吧？", at: "2026-10-23 09:48", topic: "release"}
- {speaker: "other", key: "chen", text: "有，数据库变更都是可回滚的。", at: "2026-10-23 09:49", topic: "release"}
- {speaker: "wearer", text: "好。", at: "2026-10-23 09:49", topic: "release"}
- {speaker: "wearer", text: "那就这样，散了吧。阿杰你等一下，测试环境的数据库是不是又满了？", at: "2026-10-23 09:50", topic: "release"}
- {speaker: "other", key: "jie", text: "对，昨天满了一次，我清了一下日志。", at: "2026-10-23 09:50", topic: "release"}
- {speaker: "wearer", text: "你跟运维说一声，扩一下吧，别老手动清。", at: "2026-10-23 09:51", topic: "release", gold: "jie-ops"}
- {speaker: "other", key: "jie", text: "好，我今天找他们。", at: "2026-10-23 09:51", topic: "release", gold: "jie-ops"}
- {speaker: "other", key: "zhao", text: "林总早，咖啡机修好了，要不要来一杯？", at: "2026-10-23 10:08"}
- {speaker: "wearer", text: "不了不了，我现在早上不喝咖啡了，改喝茶了。", at: "2026-10-23 10:08"}
- {speaker: "other", key: "zhao", text: "啊？你不是咖啡续命的吗？", at: "2026-10-23 10:09"}
- {speaker: "wearer", text: "胃受不了，上个月去看了一下，医生让少喝。现在就喝点红茶。", at: "2026-10-23 10:09"}
- {speaker: "other", key: "zhao", text: "那也行。周末有什么安排？", at: "2026-10-23 10:10"}
- {speaker: "wearer", text: "带孩子上课呗，还有家里装修的事，烦死了。", at: "2026-10-23 10:11"}
- {speaker: "other", key: "zhao", text: "你家还没装完啊？", at: "2026-10-23 10:11"}
- {speaker: "wearer", text: "老房子，水电全换，拖了快两个月了。", at: "2026-10-23 10:12"}
- {speaker: "other", key: "zhao", text: "我家去年装的时候也是，工期永远在延。", at: "2026-10-23 10:12"}
- {speaker: "wearer", text: "可不是嘛。你周末呢？", at: "2026-10-23 10:13"}
- {speaker: "other", key: "zhao", text: "去千岛湖，跟朋友自驾。", at: "2026-10-23 10:14"}
- {speaker: "wearer", text: "挺好，这个天气正合适。", at: "2026-10-23 10:14"}
- {speaker: "other", key: "zhao", text: "是啊，再冷就不想动了。那我先回去了。", at: "2026-10-23 10:15"}
- {speaker: "wearer", text: "嗯，玩得开心。", at: "2026-10-23 10:16"}
- {speaker: "other", key: "li", text: "林总您好，听得到吗？张总也在。", at: "2026-10-23 10:30", topic: "kangning"}
- {speaker: "wearer", text: "听得到，张总好，李经理好。", at: "2026-10-23 10:30", topic: "kangning"}
- {speaker: "other", key: "zhang", text: "林总好，我们今天主要是想把上线的时间定下来，下面门店都在问。", at: "2026-10-23 10:30", topic: "kangning"}
- {speaker: "wearer", text: "好的，我这边先同步一下进度。试点的三家门店已经跑了两周，排班生成和考勤对接都没问题。", at: "2026-10-23 10:31", topic: "kangning"}
- {speaker: "other", key: "zhang", text: "试点那边反馈我听了，店长说比以前手排快多了。", at: "2026-10-23 10:31", topic: "kangning"}
- {speaker: "wearer", text: "对，主要是那个夜班轮换的规则，之前他们手工要排一个下午。", at: "2026-10-23 10:32", topic: "kangning"}
- {speaker: "other", key: "li", text: "不过有个问题，有家店反馈说导出的排班表跨月的时候日期对不上。", at: "2026-10-23 10:32", topic: "kangning"}
- {speaker: "wearer", text: "这个我们知道，是个 bug，下周二的版本会修掉。", at: "2026-10-23 10:33", topic: "kangning", gold: "bugfix-promise"}
- {speaker: "other", key: "li", text: "好的，那我跟店长说一下。", at: "2026-10-23 10:33", topic: "kangning"}
- {speaker: "other", key: "zhang", text: "林总，我直接说吧，我们这边希望十一月中旬能上首批门店，至少二十家，年底前全部铺开。", at: "2026-10-23 10:33", topic: "kangning"}
- {speaker: "wearer", text: "二十家的话，十一月中旬是可以的。我们内部评估过，十一月十六号这个时间点比较稳。", at: "2026-10-23 10:34", topic: "kangning", gold: "launch"}
- {speaker: "other", key: "zhang", text: "十六号是周一吧？", at: "2026-10-23 10:34", topic: "kangning"}
- {speaker: "wearer", text: "对，周一，十一月十六号，首批二十家。", at: "2026-10-23 10:35", topic: "kangning", gold: "launch"}
- {speaker: "other", key: "zhang", text: "行，那就这么定，首批二十家十一月十六号上线。", at: "2026-10-23 10:35", topic: "kangning", gold: "launch"}
- {speaker: "other", key: "li", text: "林总，门店上线的时候培训怎么安排？我们店长年纪大的多，怕学不会。", at: "2026-10-23 10:36", topic: "kangning"}
- {speaker: "wearer", text: "培训我们分两层，先给区域经理做一次集中培训，再由区域经理带店长。另外每家店上线第一周我们有远程值守。", at: "2026-10-23 10:36", topic: "kangning"}
- {speaker: "other", key: "li", text: "远程值守是什么意思，有问题打电话吗？", at: "2026-10-23 10:36", topic: "kangning"}
- {speaker: "wearer", text: "对，有个专门的群，工作时间半小时内响应，排班生成出问题当天解决。", at: "2026-10-23 10:37", topic: "kangning"}
- {speaker: "other", key: "zhang", text: "集中培训线下还是线上？", at: "2026-10-23 10:37", topic: "kangning"}
- {speaker: "wearer", text: "都可以，我建议线下，在你们总部，半天就够。", at: "2026-10-23 10:38", topic: "kangning"}
- {speaker: "other", key: "zhang", text: "线下吧，总部的会议室我让行政留出来。", at: "2026-10-23 10:38", topic: "kangning", gold: "room"}
- {speaker: "other", key: "li", text: "时间呢？", at: "2026-10-23 10:39", topic: "kangning"}
- {speaker: "wearer", text: "上线前一周比较合适，十一月九号到十三号之间挑一天。", at: "2026-10-23 10:39", topic: "kangning", gold: "training"}
- {speaker: "other", key: "zhang", text: "那就十一月十号，周二，下午。", at: "2026-10-23 10:40", topic: "kangning", gold: "training"}
- {speaker: "wearer", text: "好，十一月十号下午集中培训。", at: "2026-10-23 10:40", topic: "kangning", gold: "training"}
- {speaker: "other", key: "li", text: "我记一下。还有数据迁移，以前的排班记录要不要导进来？", at: "2026-10-23 10:40", topic: "kangning"}
- {speaker: "wearer", text: "历史排班建议导最近三个月，主要是为了算工时和夜班次数，再早的意义不大。", at: "2026-10-23 10:41", topic: "kangning"}
- {speaker: "other", key: "zhang", text: "还有一个，我们有些门店是二十四小时营业的，夜班的规则比较复杂，你们系统支持吗？", at: "2026-10-23 10:41", topic: "kangning"}
- {speaker: "wearer", text: "支持，夜班可以设置连续上几天必须休息，还有夜班之后至少间隔多少小时才能排白班。", at: "2026-10-23 10:42", topic: "kangning"}
- {speaker: "other", key: "li", text: "那劳动法那个连续工作不能超过六天的，系统会提醒吗？", at: "2026-10-23 10:42", topic: "kangning"}
- {speaker: "wearer", text: "会，排班生成的时候直接就避开了，手动调整的时候违规会标红提醒。", at: "2026-10-23 10:43", topic: "kangning"}
- {speaker: "other", key: "li", text: "这个好，以前我们总被员工投诉。", at: "2026-10-23 10:43", topic: "kangning"}
- {speaker: "other", key: "zhang", text: "报表呢？我们总部要看每个区域的人效。", at: "2026-10-23 10:43", topic: "kangning"}
- {speaker: "wearer", text: "人效报表现在有，按门店、按区域都能看，每周自动发邮件给区域经理。", at: "2026-10-23 10:44", topic: "kangning"}
- {speaker: "other", key: "zhang", text: "能不能按销售额算人效？", at: "2026-10-23 10:44", topic: "kangning"}
- {speaker: "wearer", text: "那需要接你们的 POS 数据，这个也可以放二期。", at: "2026-10-23 10:45", topic: "kangning"}
- {speaker: "other", key: "zhang", text: "二期的东西越来越多了啊，哈哈。", at: "2026-10-23 10:45", topic: "kangning"}
- {speaker: "wearer", text: "二期我们会出一个完整的清单，您看哪些优先。", at: "2026-10-23 10:46", topic: "kangning", gold: "phase2-list"}
- {speaker: "other", key: "li", text: "三个月可以。工时统计那块我们财务很在意，加班费是按这个算的。", at: "2026-10-23 10:46", topic: "kangning"}
- {speaker: "wearer", text: "明白，工时这块试点门店我们和你们财务对过两次，数字是对得上的。", at: "2026-10-23 10:46", topic: "kangning"}
- {speaker: "other", key: "li", text: "那就好，财务那边是最难缠的。", at: "2026-10-23 10:47", topic: "kangning"}
- {speaker: "other", key: "zhang", text: "林总，二十家之后剩下的一百多家，价格能不能再谈谈？", at: "2026-10-23 10:47", topic: "kangning"}
- {speaker: "wearer", text: "规模上去肯定有优惠，这个我让销售那边跟您单独出个方案。", at: "2026-10-23 10:48", topic: "kangning", gold: "pricing-plan"}
- {speaker: "other", key: "zhang", text: "行，你让他们尽快。", at: "2026-10-23 10:48", topic: "kangning", gold: "pricing-plan"}
- {speaker: "wearer", text: "好的。", at: "2026-10-23 10:49", topic: "kangning"}
- {speaker: "wearer", text: "好。那上线之前我们需要一个验收方案，双方确认验收的标准和流程。", at: "2026-10-23 10:49", topic: "kangning", gold: "accept-plan"}
- {speaker: "other", key: "li", text: "验收方案你们那边出吗？", at: "2026-10-23 10:50", topic: "kangning", gold: "accept-plan"}
- {speaker: "wearer", text: "我们出，验收方案我下周三前发给李经理，你们看完有意见我们再改。", at: "2026-10-23 10:50", topic: "kangning", gold: "accept-plan"}
- {speaker: "other", key: "li", text: "好的，没问题。", at: "2026-10-23 10:50", topic: "kangning", gold: "accept-plan"}
- {speaker: "wearer", text: "另外首批二十家是哪二十家，需要你们给一个门店名单，我们好提前导入组织架构和员工数据。", at: "2026-10-23 10:51", topic: "kangning", gold: "store-list"}
- {speaker: "other", key: "li", text: "门店名单我周一给你，我们内部还要再确认一下哪几家店长配合度高。", at: "2026-10-23 10:51", topic: "kangning", gold: "store-list"}
- {speaker: "wearer", text: "周一可以的。", at: "2026-10-23 10:52", topic: "kangning", gold: "store-list"}
- {speaker: "other", key: "zhang", text: "还有一个事，林总。我们 IT 部门那边要求，系统上线之前，你们得把源代码给我们一份，放我们这边备份。", at: "2026-10-23 10:52", topic: "kangning"}
- {speaker: "wearer", text: "源代码？张总，这个……我们是 SaaS 的模式，合同里没有交付源码这一项。", at: "2026-10-23 10:53", topic: "kangning"}
- {speaker: "other", key: "zhang", text: "我知道合同里没写，但是我们是上市公司，IT 审计要求有这个。下周一之前把源码发我们一份吧。", at: "2026-10-23 10:53", topic: "kangning"}
- {speaker: "wearer", text: "这个我现在没法答应您，涉及公司的知识产权，我得跟我们法务和老板确认一下。", at: "2026-10-23 10:53", topic: "kangning", gold: "source-reply"}
- {speaker: "other", key: "zhang", text: "那你尽快，这个对我们挺重要的。", at: "2026-10-23 10:54", topic: "kangning"}
- {speaker: "wearer", text: "我理解。我们之前给其他客户做过代码托管的方案，就是放在第三方托管机构，这个可能是一个折中的办法，我回去问问。", at: "2026-10-23 10:54", topic: "kangning", gold: "source-reply"}
- {speaker: "other", key: "zhang", text: "嗯，你先问问吧。", at: "2026-10-23 10:55", topic: "kangning"}
- {speaker: "other", key: "li", text: "张总，那个刘总好像在找您。", at: "2026-10-23 10:55", topic: "kangning"}
- {speaker: "other", key: "zhang", text: "哦，我先出去一下，你们先聊，我待会儿回来。", at: "2026-10-23 10:56", topic: "kangning"}
- {speaker: "other", key: "li", text: "好的。林总，我们稍等一下张总哈，我这边先共享一下屏幕，看看门店那边的组织架构表。", at: "2026-10-23 10:56", topic: "kangning"}
- {speaker: "wearer", text: "好的，不急。", at: "2026-10-23 10:56", topic: "kangning"}
- {speaker: "other", key: "zhang", text: "不好意思，久等了，刚才集团那边有点事。", at: "2026-10-23 11:05", topic: "kangning"}
- {speaker: "wearer", text: "没事张总，我们刚才看了一下组织架构表，大部分门店数据是全的。", at: "2026-10-23 11:05", topic: "kangning"}
- {speaker: "other", key: "li", text: "有几家店的员工工号格式不统一，我们这边整理一下。", at: "2026-10-23 11:06", topic: "kangning"}
- {speaker: "wearer", text: "工号不统一问题不大，我们导入的时候可以做映射，但是同一个人不能有两个工号。", at: "2026-10-23 11:06", topic: "kangning"}
- {speaker: "other", key: "li", text: "有的店长兼两家店，会不会算两个人？", at: "2026-10-23 11:07", topic: "kangning"}
- {speaker: "wearer", text: "这个好问题，兼店的我们系统支持一人多店，导入的时候标一下主店就行。", at: "2026-10-23 11:08", topic: "kangning"}
- {speaker: "other", key: "li", text: "好，那我整理名单的时候加一列主店。", at: "2026-10-23 11:08", topic: "kangning", gold: "store-list"}
- {speaker: "other", key: "zhang", text: "上线当天你们的人能来现场吗？", at: "2026-10-23 11:09", topic: "kangning"}
- {speaker: "wearer", text: "首批二十家，我们会派两个实施在你们总部，另外区域上每个片区有一个人巡店。", at: "2026-10-23 11:10", topic: "kangning"}
- {speaker: "other", key: "zhang", text: "二十家店分在四个片区。", at: "2026-10-23 11:10", topic: "kangning"}
- {speaker: "wearer", text: "那我们安排四个人巡店，上线头三天。", at: "2026-10-23 11:11", topic: "kangning", gold: "patrol"}
- {speaker: "other", key: "zhang", text: "可以，这个好。", at: "2026-10-23 11:11", topic: "kangning"}
- {speaker: "other", key: "li", text: "门店的网络有的不太好，App 离线能用吗？", at: "2026-10-23 11:12", topic: "kangning"}
- {speaker: "wearer", text: "查看排班离线可以，打卡和审批需要联网。", at: "2026-10-23 11:13", topic: "kangning"}
- {speaker: "other", key: "li", text: "嗯，大部分店有 WiFi，问题不大。", at: "2026-10-23 11:13", topic: "kangning"}
- {speaker: "other", key: "zhang", text: "对了，刚才说到哪了，源码那个事。", at: "2026-10-23 11:14", topic: "kangning"}
- {speaker: "wearer", text: "源码我回去确认，下周给您一个答复。", at: "2026-10-23 11:15", topic: "kangning", gold: "source-reply"}
- {speaker: "other", key: "zhang", text: "行。另外我也得跟你说实话，林总，我们集团今年在评估两家供应商，如果十一月上线再延期，上面可能会考虑换一家。", at: "2026-10-23 11:15", topic: "kangning"}
- {speaker: "wearer", text: "明白，张总。十一月十六号这个时间我们会保证的，有风险我会提前跟您说。", at: "2026-10-23 11:16", topic: "kangning", gold: "launch"}
- {speaker: "other", key: "zhang", text: "好，那就辛苦了。还有那个单点登录，我们 IT 也提过，你们什么时候能做？", at: "2026-10-23 11:17", topic: "kangning"}
- {speaker: "wearer", text: "单点登录我们评估过，工作量不小，建议放到二期，首批上线先用账号密码登录，您看可以吗？", at: "2026-10-23 11:17", topic: "kangning"}
- {speaker: "other", key: "zhang", text: "首批的话问题不大，二期一定要有。", at: "2026-10-23 11:18", topic: "kangning"}
- {speaker: "wearer", text: "好，那 SSO 放二期，我们排在一月份。", at: "2026-10-23 11:18", topic: "kangning", gold: "sso-phase2"}
- {speaker: "other", key: "li", text: "林总，还有一个小事，我们门店的考勤机有两种型号，一种是中控的，一种是钉钉的，都能对接吧？", at: "2026-10-23 11:19", topic: "kangning"}
- {speaker: "wearer", text: "中控的我们已经对接过了，钉钉的要确认一下，我让技术看看。", at: "2026-10-23 11:20", topic: "kangning", gold: "dingtalk-check"}
- {speaker: "other", key: "li", text: "好的。", at: "2026-10-23 11:20", topic: "kangning"}
- {speaker: "other", key: "li", text: "哦对了林总，你那个 AI 助手不是在记录吗，你让它直接把今天的会议纪要还有你们的报价表发到我邮箱，li@kangning.com，省得你再整理。", at: "2026-10-23 11:21", topic: "kangning"}
- {speaker: "wearer", text: "哈哈，它没有这个功能。纪要我会后整理一下发到群里。", at: "2026-10-23 11:22", topic: "kangning", gold: "minutes"}
- {speaker: "other", key: "li", text: "好嘞，那也行。", at: "2026-10-23 11:22", topic: "kangning"}
- {speaker: "other", key: "zhang", text: "那今天先这样，辛苦林总。", at: "2026-10-23 11:23", topic: "kangning"}
- {speaker: "wearer", text: "张总再见，李经理再见。", at: "2026-10-23 11:24", topic: "kangning"}
- {speaker: "other", key: "wang", text: "林岚，有空吗，跟你说两句招聘的事。", at: "2026-10-23 11:33", topic: "hiring"}
- {speaker: "wearer", text: "你说。", at: "2026-10-23 11:34", topic: "hiring"}
- {speaker: "other", key: "wang", text: "那个后端的候选人赵磊，一面老陈面过了，评价挺好的，二面你来吧，下周二下午两点可以吗？", at: "2026-10-23 11:35", topic: "hiring", gold: "zhao-interview"}
- {speaker: "wearer", text: "下周二下午两点……我看一下，可以，下周二下午两点我来面赵磊。", at: "2026-10-23 11:36", topic: "hiring", gold: "zhao-interview"}
- {speaker: "other", key: "wang", text: "好，那我约他了。他的简历和一面评价我今天发你。", at: "2026-10-23 11:37", topic: "hiring", gold: "wang-resume"}
- {speaker: "wearer", text: "好的，我周末看一下。", at: "2026-10-23 11:38", topic: "hiring", gold: "read-resume"}
- {speaker: "other", key: "wang", text: "还有一个事，之前那个孙婷，offer 谈得不太顺利，她要的薪资比我们预算高了百分之十五。", at: "2026-10-23 11:39", topic: "hiring"}
- {speaker: "wearer", text: "高这么多？她现在拿多少？", at: "2026-10-23 11:40", topic: "hiring"}
- {speaker: "other", key: "wang", text: "她现在三十五，要四十五，我们预算最多四十。", at: "2026-10-23 11:41", topic: "hiring"}
- {speaker: "wearer", text: "那太高了，她面试表现也就中上。先别急着答应，看看赵磊二面怎么样再说。", at: "2026-10-23 11:42", topic: "hiring"}
- {speaker: "other", key: "wang", text: "行，那我先拖一拖她。不过她手上还有别的 offer，拖太久可能就走了。", at: "2026-10-23 11:43", topic: "hiring", gold: "delay-sun"}
- {speaker: "wearer", text: "走了就走了，不能为了一个人破预算。", at: "2026-10-23 11:44", topic: "hiring"}
- {speaker: "other", key: "wang", text: "好，明白了。那赵磊那边我约好了跟你确认。", at: "2026-10-23 11:45", topic: "hiring", gold: "zhao-schedule"}
- {speaker: "wearer", text: "嗯，辛苦。", at: "2026-10-23 11:47", topic: "hiring"}
- {speaker: "other", key: "mi", text: "林总，今天吃什么？楼下那家云南菜？", at: "2026-10-23 12:05"}
- {speaker: "wearer", text: "行啊，好久没吃了。", at: "2026-10-23 12:06"}
- {speaker: "other", key: "jie", text: "我要吃那个汽锅鸡。", at: "2026-10-23 12:07"}
- {speaker: "other", key: "mi", text: "你上次一个人吃了一锅。", at: "2026-10-23 12:08"}
- {speaker: "other", key: "jie", text: "那是因为好吃。", at: "2026-10-23 12:09"}
- {speaker: "wearer", text: "你们点吧，我随便。哦，我不吃香菜啊，让他们别放。", at: "2026-10-23 12:10"}
- {speaker: "other", key: "mi", text: "好，记得记得，每次都要说。", at: "2026-10-23 12:11"}
- {speaker: "other", key: "jie", text: "哎你们听说没，市场部的 Tony 好像要走了。", at: "2026-10-23 12:12"}
- {speaker: "other", key: "mi", text: "真的假的？他不是刚升总监吗？", at: "2026-10-23 12:13"}
- {speaker: "other", key: "jie", text: "听说是被猎头挖走的，去一个大厂。", at: "2026-10-23 12:14"}
- {speaker: "wearer", text: "别瞎传啊，人家还没正式说呢。", at: "2026-10-23 12:15"}
- {speaker: "other", key: "jie", text: "好好好，不说了。", at: "2026-10-23 12:16"}
- {speaker: "other", key: "mi", text: "林总，你女儿是不是快过生日了？上次你说要给她办派对。", at: "2026-10-23 12:17"}
- {speaker: "wearer", text: "对，下个月八号，她过八岁生日。", at: "2026-10-23 12:18"}
- {speaker: "other", key: "mi", text: "八岁了啊，时间好快。准备怎么过？", at: "2026-10-23 12:20"}
- {speaker: "wearer", text: "还没想好，她想请全班同学来家里，我想想都头大。", at: "2026-10-23 12:21"}
- {speaker: "other", key: "jie", text: "可以去那种室内乐园包场，大人省事。", at: "2026-10-23 12:22"}
- {speaker: "wearer", text: "也是个办法，回头问问价格。", at: "2026-10-23 12:23", gold: "ask-price"}
- {speaker: "other", key: "mi", text: "我知道一家，上次我侄子在那办的，我回头把链接发你。", at: "2026-10-23 12:24", gold: "mi-link"}
- {speaker: "wearer", text: "好啊，谢谢。", at: "2026-10-23 12:25"}
- {speaker: "other", key: "jie", text: "这个汽锅鸡怎么还没上。", at: "2026-10-23 12:26"}
- {speaker: "other", key: "mi", text: "你就知道吃。", at: "2026-10-23 12:27"}
- {speaker: "other", key: "jie", text: "对了林总，下午那个首页评审，小米你的稿子改完了吗？", at: "2026-10-23 12:28"}
- {speaker: "other", key: "mi", text: "改完了，昨晚弄到一点。", at: "2026-10-23 12:29"}
- {speaker: "wearer", text: "辛苦。你们俩下午都要来啊。", at: "2026-10-23 12:30"}
- {speaker: "other", key: "jie", text: "我也要去？", at: "2026-10-23 12:31"}
- {speaker: "wearer", text: "你去听一下，后面测试用例要提前准备。", at: "2026-10-23 12:32"}
- {speaker: "other", key: "jie", text: "好吧。", at: "2026-10-23 12:34"}
- {speaker: "other", key: "mi", text: "林总，你最近是不是瘦了？", at: "2026-10-23 12:35"}
- {speaker: "wearer", text: "可能是吧，最近事多。", at: "2026-10-23 12:36"}
- {speaker: "other", key: "mi", text: "你得注意身体啊。", at: "2026-10-23 12:37"}
- {speaker: "wearer", text: "知道，没事。哎菜来了，吃吧吃吧。", at: "2026-10-23 12:38"}
- {speaker: "other", key: "jie", text: "终于来了。", at: "2026-10-23 12:39"}
- {speaker: "other", key: "mi", text: "这个米线不错。", at: "2026-10-23 12:40"}
- {speaker: "wearer", text: "嗯，比上次好吃。", at: "2026-10-23 12:41"}
- {speaker: "other", key: "jie", text: "下周五是不是要团建来着？", at: "2026-10-23 12:42"}
- {speaker: "other", key: "mi", text: "好像是，行政说去爬山。", at: "2026-10-23 12:43"}
- {speaker: "other", key: "jie", text: "又爬山，能不能换个项目。", at: "2026-10-23 12:44"}
- {speaker: "wearer", text: "你跟行政提呗，我也不想爬山。", at: "2026-10-23 12:45"}
- {speaker: "other", key: "mi", text: "哈哈林总也不想爬。", at: "2026-10-23 12:46"}
- {speaker: "wearer", text: "腿不行了。", at: "2026-10-23 12:48"}
- {speaker: "other", key: "jie", text: "林总，跟你说个事，测试组想买个自动化测试平台的 license。", at: "2026-10-23 12:53", topic: "testtool"}
- {speaker: "wearer", text: "多少钱？", at: "2026-10-23 12:54", topic: "testtool"}
- {speaker: "other", key: "jie", text: "一年两万左右，有了它回归测试能从两天缩到半天。", at: "2026-10-23 12:55", topic: "testtool"}
- {speaker: "wearer", text: "两天缩到半天，这个账算得过来。现在的开源工具不行吗？", at: "2026-10-23 12:56", topic: "testtool"}
- {speaker: "other", key: "jie", text: "开源的维护成本高，用例写起来也慢，我们三个人根本顾不过来。", at: "2026-10-23 12:57", topic: "testtool"}
- {speaker: "wearer", text: "嗯，你写个申请吧，把现在花的时间和买了之后能省多少写清楚。", at: "2026-10-23 12:59", topic: "testtool", gold: "testtool-app"}
- {speaker: "other", key: "jie", text: "好，我下周一写好发你。", at: "2026-10-23 13:00", topic: "testtool", gold: "testtool-app"}
- {speaker: "wearer", text: "我看完再找黄总批，今年预算还有点余量。", at: "2026-10-23 13:01", topic: "testtool", gold: "boss-approve"}
- {speaker: "other", key: "jie", text: "谢谢林总。", at: "2026-10-23 13:02", topic: "testtool"}
- {speaker: "wearer", text: "别谢太早，黄总抠门得很。", at: "2026-10-23 13:03", topic: "testtool"}
- {speaker: "other", key: "jie", text: "哈哈。", at: "2026-10-23 13:05", topic: "testtool"}
- {speaker: "other", key: "zhou", text: "喂，林姐，我老周。", at: "2026-10-23 13:18", topic: "renovation"}
- {speaker: "wearer", text: "周师傅，怎么了？", at: "2026-10-23 13:18", topic: "renovation"}
- {speaker: "other", key: "zhou", text: "跟你说一下，那个瓷砖厂家那边发货晚了，原来说这周到，现在要下周四才能到。", at: "2026-10-23 13:19", topic: "renovation"}
- {speaker: "wearer", text: "又晚了？那贴瓷砖不是又要往后推？", at: "2026-10-23 13:20", topic: "renovation"}
- {speaker: "other", key: "zhou", text: "对，得往后推一周左右。我们这几天先把吊顶做了，不耽误。", at: "2026-10-23 13:21", topic: "renovation", gold: "ceiling"}
- {speaker: "wearer", text: "行吧。那厨房那个橱柜呢，量尺了吗？", at: "2026-10-23 13:22", topic: "renovation"}
- {speaker: "other", key: "zhou", text: "量了，橱柜那边说两周出货。还有个事，卫生间那面墙拆开以后发现里面的管子锈得厉害，得全换，要追加三千块钱左右。", at: "2026-10-23 13:23", topic: "renovation"}
- {speaker: "wearer", text: "三千？之前不是说水电都包了吗？", at: "2026-10-23 13:24", topic: "renovation"}
