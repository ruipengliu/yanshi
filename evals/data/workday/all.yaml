- {speaker: "other", key: "mi", text: "好的。这次首页改版主要三个目标：第一，店长打开 App 第一眼就能看到今天的排班；第二，减少首页的干扰信息；第三，首屏加载要快。", at: "2026-10-23 14:00", topic: "homepage"}
