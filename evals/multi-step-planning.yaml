name: multi-step-planning
description: >-
  多步规划：读三份文件，按人数、预算、素食与日期约束选出唯一可行的场地，写出方案（需审批）。
  正确答案：10 月 24 日可参加 9 人（陈晨请假）；场地中容量够、有素食、9 人总价不超过 2000 元的只有"竹林小院"（9×198=1782 元）。
setup:
  device:
    label: macbook
    files:
      team.txt: |
        团队成员（10 人）与 10 月 24 日（周五）是否可参加：
        王敏 可以；李雷 可以；陈晨 请假；赵琳 可以（素食）；孙浩 可以；
        周倩 可以；吴磊 可以（素食）；郑爽 可以；冯涛 可以；何静 可以
      venues.txt: |
        候选场地（人均价格含餐）：
        1. 江畔餐厅：最多 12 人，人均 238 元，有素食
        2. 竹林小院：最多 10 人，人均 198 元，有素食
        3. 老街火锅：最多 15 人，人均 168 元，无素食
        4. 山顶露营：最多 8 人，人均 158 元，有素食
      budget.txt: |
        团建预算：总额不超过 2000 元（含餐），超出需总监审批，本次不申请。
turns:
  - input: >-
      帮我安排 10 月 24 日的团建：看一下电脑上的 team.txt、venues.txt 和 budget.txt，选一个满足人数、预算和素食要求的场地，
      把方案（场地、人数、总价）写到电脑上的 plan.md。
    expect:
      status: completed
      calls: ["macbook__read_file", "macbook__write_file"]
      approvals: {min: 1}
      device_writes: {"plan.md": "竹林小院"}
      reply_contains: ["竹林小院"]
      judge: 方案是否选择竹林小院、人数 9 人、总价 1782 元，并说明排除其他场地的原因（超预算、无素食或容量不足）？
