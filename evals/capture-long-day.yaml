name: capture-long-day
description: >-
  长的一天（captures-by-exchange.md §4）：早上第一段交谈中佩戴者答应周三前发合同，之后是十几段无关的闲聊。用例把上下文
  窗口调小，使整理途中必然压缩；逐段交出之后，压缩只丢已经交出的原文，承诺仍在账本中，当天总览依据 day_exchanges 写成。
agent: xinli-day
context: {window: 24000, keep_recent: 6000, max_tool_result: 6000}
setup:
  xinli: {}
turns:
  - captures_file: data/long-day.yaml
    input: 整理今天
    expect:
      calls: ["mcp_xinli__file_exchange", "mcp_xinli__day_exchanges", "mcp_xinli__file_day"]
      compactions: {min: 1}
      xinli:
        commitments:
          - {kind: mine, contains: 合同, due_date: "2026-10-28", verified: true}
      call_args: {"mcp_xinli__file_day": "合同"}
