name: capture-relative-date
description: >-
  旁听带当地时间时，"明天""下周一"按说话那天的日期换算成具体日期，写进承诺的 due_date（captures.md §5）。
agent: xinli-day
setup:
  xinli: {}
turns:
  - captures:
      - {speaker: other, key: zhang, text: 新办公室的装修报价什么时候能给我？, at: "2026-10-23 10:15"}
      - {speaker: wearer, text: 张总，报价单我明天上午发您。, at: "2026-10-23 10:15"}
      - {speaker: other, key: zhang, text: 好，下周一我们开会定施工方。, at: "2026-10-23 10:16"}
      - {speaker: wearer, text: 行，下周一开会前我把施工方的资质材料整理好给您。, at: "2026-10-23 10:16"}
    input: 整理今天
    expect:
      calls: ["mcp_xinli__file_exchange", "mcp_xinli__file_day"]
      xinli:
        commitments:
          - {kind: mine, contains: 报价, due_date: "2026-10-24", verified: true}
          - {kind: mine, contains: 资质, due_date: "2026-10-26", verified: true}
