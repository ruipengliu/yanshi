name: capture-exchange-split
description: >-
  模型在时段里划交谈（xinli-model.md §8）：与供应商谈完采购，三分钟后同事来约团建，停顿不到时段间隔，平台把
  它们读成一个时段；模型按内容划成两段交谈，各自的承诺各归各的交谈，一个变更集交出，最后交出当天总览。
agent: xinli-day
setup:
  xinli: {}
turns:
  - captures:
      - {speaker: other, key: wang, text: 新一季的采购，我们先小批量试单吧。, at: "2026-10-22 09:30"}
      - {speaker: wearer, text: 可以，试单的报价单我明天发您。, at: "2026-10-22 09:31"}
      - {speaker: other, key: wang, text: 好，收到报价我们就下单。, at: "2026-10-22 09:32"}
      - {speaker: other, key: li, text: 下周五部门团建，你来定地方吧？, at: "2026-10-22 09:35"}
      - {speaker: wearer, text: 行，周三前我把两三个候选地点发群里。, at: "2026-10-22 09:36"}
      - {speaker: other, key: li, text: 好，我来统计人数。, at: "2026-10-22 09:37"}
    input: 整理今天
    expect:
      calls: ["mcp_xinli__file_changes", "mcp_xinli__day_ledger", "mcp_xinli__file_day"]
      xinli:
        exchanges: {min: 2, max: 2}
        commitments:
          - {kind: mine, contains: 报价, due_date: "2026-10-23", verified: true}
          - {kind: mine, contains: 地点, due_date: "2026-10-28", verified: true}
          - {kind: theirs, contains: 人数, verified: true}
