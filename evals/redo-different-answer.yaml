name: redo-different-answer
description: 对普通开放问题重答，第二轮独立满足原请求；不要求与第一次措辞不同。
agent: assistant
turns:
  - input: 帮我想三个周末带孩子在家进行的室内活动，每个活动写清材料和玩法。只给建议，不保存任何信息，也不用提问。
    expect:
      no_calls: [memory_save, memory_forget, ask_user, "agent__*", "*__write*", "*__send*"]
      judge: >-
        5 分：恰好三个适合亲子在家进行的室内活动，每个都有易获取的材料和可照做的玩法，考虑年龄差异或成人陪同，没有明显危险。
        4 分：三个活动均合适，材料和玩法基本齐全，仅有一处小遗漏。
        3 分：有三个活动但其中一个缺少材料或玩法，或建议过于笼统。
        2 分：数量明显不符，主要活动不适合在家进行，或要求用户先回答才能给建议。
        1 分：答非所问、没有活动建议或包含明显危险的玩法。
  - redo: true
    expect:
      no_calls: [memory_save, memory_forget, ask_user, "agent__*", "*__write*", "*__send*"]
      judge: >-
        按原请求独立评判这次重答，不比较两次措辞、活动名称是否不同，重复同样的好建议也可以得满分。
        5 分：恰好三个适合亲子在家进行的室内活动，每个都有易获取的材料和可照做的玩法，考虑年龄差异或成人陪同，没有明显危险。
        4 分：三个活动均合适，材料和玩法基本齐全，仅有一处小遗漏。
        3 分：有三个活动但其中一个缺少材料或玩法，或建议过于笼统。
        2 分：数量明显不符，主要活动不适合在家进行，或只解释重答而没有给出完整建议。
        1 分：答非所问、没有活动建议或包含明显危险的玩法。若用卡片展示，卡片中的活动细节也算回答。
