name: capture-day-digest
description: >-
  每日整理的结构（captures-by-exchange.md §4、§5）：file_exchange 交出交谈中定下的事、双方各自的承诺与风险，file_day
  交出今日总览与对佩戴者沟通方式的觉察。佩戴者答应的（报价单）是 mine，他人答应的（合同草稿）是 theirs，他人索要而
  佩戴者没有答应的（预算表）不是承诺；觉察不写情绪。
agent: xinli-day
setup:
  xinli: {}
turns:
  - captures:
      - {speaker: other, key: liu, text: 新办公室的设计稿我改好了，地板换成了浅色木纹。家具供应商说可能要晚两周到货。, at: "2026-10-21 09:00"}
      - {speaker: wearer, text: 浅色木纹可以，就定这个。我周五前把报价单整理好发给你。, at: "2026-10-21 09:01"}
      - {speaker: other, key: liu, text: 好，那我下周一把合同草稿给你。, at: "2026-10-21 09:02"}
      - {speaker: wearer, text: 家具晚两周会耽误十二月搬家，你先问问供应商有没有现货。, at: "2026-10-21 09:03"}
      - {speaker: other, key: liu, text: 对了，你顺便把你们部门的预算表也发我一份。, at: "2026-10-21 09:04"}
      - {speaker: wearer, text: 下午三点的会我先过去了。, at: "2026-10-21 09:05"}
    input: 整理今天
    expect:
      calls: ["mcp_xinli__file_exchange", "mcp_xinli__file_day"]
      call_args: {"mcp_xinli__file_day": "headline"}
      xinli:
        exchanges: {min: 1, max: 1}
        commitments:
          - {kind: mine, contains: 报价单, due_date: "2026-10-23", verified: true}
          - {kind: theirs, contains: 合同, due_date: "2026-10-26", verified: true}
        no_commitments:
          - {kind: mine, contains: 预算}
          - {kind: mine, contains: 合同}
      judge: >-
        看 file_exchange 与 file_day 的参数：day.headline 是否概括了这一天；交谈的 decisions 是否包含定下浅色木纹；
        risks 是否指出家具可能晚到、影响十二月搬家；summary 是否写明对方索要预算表而佩戴者没有答应；
        file_day 的 awareness 是否只写佩戴者的沟通方式（如给出明确期限、主动推动解决问题），没有写情绪或身心状态。
        全部满足为 5 分，缺一项扣一分。
