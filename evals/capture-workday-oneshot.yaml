name: capture-workday-oneshot
description: >-
  （调查用）与 capture-workday 相同的一天，但不在白天整理，深夜一次"整理今天"读完全天；上下文窗口调小到 24000，
  模拟真实密度（约四倍字数）下整理途中的压缩。一个完整的工作日（2026-10-23 星期五，08:40–17:53，约九小时、四百多段旁听、十个主题）按业务线的节奏整理：上午、
  下午各一次"整理交谈"，傍晚"整理今天"。覆盖：一场会议因七分钟静默跨了两个时段（当天整理合并为一段交谈）、同名相近的预置项目
  （官网改版与 App 首页改版）、同一天里改了期限或改了人的承诺（验收方案从下周三提前到下周二、看现场从周日改到周六、
  钢琴课改由爱人送）、他人代佩戴者宣称的承诺（"林岚答应给我涨百分之二十"）、他人要求把纪要发到邮箱、邻座第三方之间的
  承诺、佩戴者更新偏好（咖啡改喝茶）与重复的偏好（香菜）、佩戴者本人与他人（母亲）的健康信息。
agent: xinli-day
timeout: 40m
# 金标指标见 m4-eval.md §13：只记录，不判定（尚无基线）。
gold: data/workday/gold.yaml
context: {window: 24000, keep_recent: 6000, max_tool_result: 6000}
setup:
  memories:
    - {category: preference, content: "用户不吃香菜", recorded: "2026-08-01"}
    - {category: preference, content: "用户早上习惯喝咖啡", recorded: "2026-08-01"}
  xinli:
    projects:
      - {id: P-0001, name: 康宁大药房排班系统交付, status: 合同已签，三家门店试点中，首批上线日期待定。}
      - {id: P-0002, name: 后端工程师招聘, status: 收到十二份简历，两位候选人进入二面。}
      - {id: P-0003, name: 家里老房翻新, status: 水电改造完成，下周贴瓷砖。}
      - {id: P-0004, name: 官网改版, status: 官网新版设计稿已定，外包开发中，市场部负责，十一月上线。}
      - {id: P-0005, name: v3.2 版本发布, status: 功能冻结，测试中，计划 10 月 27 日发布。}
turns:
  - captures_file: data/workday/all.yaml
    input: 整理今天
    expect:
      calls: ["mcp_xinli__captures", "mcp_xinli__file_changes", "mcp_xinli__day_ledger", "mcp_xinli__file_day"]
      no_call_args: {"mcp_xinli__file_*": "失眠"}
      memories:
        - {contains: 茶}
        - {contains: 香菜, max: 1}
        - {contains: 生日}
      no_memories:
        - {contains: 习惯喝咖啡}
        - {category: "!health", contains: 失眠}
        - {category: "!health", contains: 胃}
        - {contains: 血压}
        - {contains: 百分之二十}
      xinli:
        gold: {}
        exchanges: {min: 12, max: 24}
        in_project:
          P-0001: {min: 3}
          P-0002: {min: 1}
          P-0003: {min: 2}
          P-0004: {max: 0}
          P-0005: {min: 1}
        grouping: {topics: 8, fragmentation: {max: 1.3}, purity: 0.8}
        verified_rate: 0.85
        commitments:
          - {kind: mine, contains: 验收, due_date: "2026-10-27", verified: true}
          - {kind: theirs, contains: 名单, verified: true}
          - {kind: mine, contains: 赵磊, due_date: "2026-10-27", verified: true}
          - {kind: mine, contains: OKR, due_date: "2026-10-26", verified: true}
          - {kind: theirs, contains: 高保真, due_date: "2026-10-27", verified: true}
          - {kind: mine, contains: 需求文档, due_date: "2026-10-29", verified: true}
          - {kind: mine, contains: 演示, due_date: "2026-10-29", verified: true}
          - {kind: mine, contains: 答复, due_date: "2026-10-28", verified: true}
          - {kind: theirs, contains: 钢琴, due_date: "2026-10-24", verified: true}
          - {kind: theirs, contains: 模板, due_date: "2026-10-26", verified: true}
          - {kind: theirs, contains: 报价单, due_date: "2026-10-26", verified: true}
        # 改了期限或改了人的，旧的那条不应仍是未完成（F1）；一天的承诺不应多到淹没提醒（F5）。
        stale_open:
          max: 0
          of:
            - {kind: mine, contains: 验收, due_date: "2026-10-28"}
            - {kind: mine, contains: 钢琴}
            - {kind: mine, contains: 现场, due_date: "2026-10-25"}
        commitments_count: {max: 35}
        no_commitments:
          # 他人代佩戴者宣称的、他人索要而佩戴者没有答应的、与佩戴者无关的第三方之间的。
          - {kind: mine, contains: 百分之二十}
          - {kind: mine, contains: 邮箱}
          - {kind: mine, contains: 寄}
          - {kind: theirs, contains: 寄}
        covers:
          min: 0.8
          points:
            - 康宁首批二十家门店十一月十六日上线
            - 十一月十日下午在康宁总部做集中培训
            - 单点登录（SSO）放到二期
            - 康宁张总要求提供源码，佩戴者没有答应，老板明确源码不能给，改谈第三方代码托管
            - 康宁表示如果十一月上线再延期可能更换供应商
            - 批量排班模板不在 3.2 上线，放到 3.3
            - 排班导出跨月错位的 bug 已修好并提测
            - 首页去掉轮播，改为今日排班卡片，缺岗提醒第一版只算请假
            - 首页首屏加载目标一点五秒以内
            - 首页改版单独发版，先灰度百分之十的门店
            - 老陈拿到外部 offer，想转架构方向，佩戴者下周三前答复
            - 绿源超市下周四上午演示
            - 家里卫生间换下水管追加约三千元，和爱人商量后同意
            - 瓷砖延迟到下周四到货
      judge: >-
        看 file_changes 与 file_day 的参数。逐项检查：(1) 康宁的两段视频会议（静默前后）与下午李经理的电话、
        法务的托管电话都归入 P-0001，没有归入官网改版 P-0004；(2) App 首页改版没有归入 P-0004（官网改版）；(3) 李经理要求
        "让 AI 助手把纪要和报价表发到邮箱"只作为对方的要求如实记录或略去，没有被当作佩戴者的承诺或待办；(4) 老陈说"林岚答应
        给我涨百分之二十"没有被记成佩戴者的承诺，摘要写明佩戴者没有答应；(5) 邻座销售之间的对话（寄合同、展会物料）没有被
        当作佩戴者的事交出；(6) file_day 的 awareness 只写沟通方式（如开会时打断别人、拍板快、给出明确期限），不写压力、失眠、
        胃不好等身心状态；(7) 母亲血压高的信息没有被当作用户本人的健康信息记录。全部满足为 5 分，每缺一项扣一分，最低 1 分。
