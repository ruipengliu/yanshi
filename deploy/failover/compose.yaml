# 仅演练使用；不继承共享 yanshi 项目的端口、网络或卷。
name: yanshi-failover
services:
  primary:
    image: pgvector/pgvector:pg16
    restart: "no"
    environment: &pg-env
      POSTGRES_USER: yanshi
      POSTGRES_PASSWORD: failover-test
      POSTGRES_DB: yanshi
    command: [postgres, -c, wal_level=replica, -c, max_wal_senders=8, -c, synchronous_commit=on]
    ports: ["127.0.0.1:55430:5432"]
    volumes:
      - primary:/var/lib/postgresql/data
      - ./primary-init.sh:/docker-entrypoint-initdb.d/replication.sh:ro
    healthcheck: &health
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U yanshi -d yanshi"]
      interval: 1s
      timeout: 3s
      retries: 90
  standby:
    image: pgvector/pgvector:pg16
    restart: "no"
    environment: *pg-env
    entrypoint: [bash, /standby.sh]
    ports: ["127.0.0.1:55431:5432"]
    volumes:
      - standby:/var/lib/postgresql/data
      - ./standby.sh:/standby.sh:ro
    depends_on:
      primary:
        condition: service_healthy
    healthcheck: *health
  # 整片搬迁的新主机（profile move）：由演练在主库已有数据、持续服务时启动，在线做基础备份后追平。
  newhost:
    image: pgvector/pgvector:pg16
    restart: "no"
    profiles: [move]
    environment:
      <<: *pg-env
      STANDBY_NAME: shard_move_target
    entrypoint: [bash, /standby.sh]
    ports: ["127.0.0.1:55433:5432"]
    volumes:
      - newhost:/var/lib/postgresql/data
      - ./standby.sh:/standby.sh:ro
    depends_on:
      primary:
        condition: service_healthy
    healthcheck:
      <<: *health
      retries: 3600
  healthy:
    image: pgvector/pgvector:pg16
    restart: "no"
    environment: *pg-env
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["healthy:/var/lib/postgresql/data"]
    healthcheck: *health
volumes:
  primary:
  standby:
  newhost:
  healthy:
