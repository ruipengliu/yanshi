# 沙箱控制器：受信控制器，只有它持有容器运行时的权限（ADR-0008）；沙箱本身是不可信代码，在独立节点池上以
# gVisor 运行（ADR-0010）。目前只有 Docker 实现（-sandbox docker -sandbox-runtime runsc），这里挂载节点上的 Docker；
# 生产 Provider 尚待选型（上线检查清单），届时替换为调用 K8s API 或云厂商服务的实现。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: yanshi-sandbox-ctl
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: yanshi, app.kubernetes.io/component: sandbox-ctl}
  template:
    metadata:
      labels: {app.kubernetes.io/name: yanshi, app.kubernetes.io/component: sandbox-ctl}
    spec:
      nodeSelector: {yanshi.io/pool: sandbox}
      tolerations:
        - {key: yanshi.io/sandbox, operator: Exists, effect: NoSchedule}
      containers:
        - name: yanshi
          image: yanshi
          args: [serve, -roles=sandbox, -sandbox=docker, -sandbox-runtime=runsc, -sandbox-controllers=4, -peer-addr=0.0.0.0:7070,
            -peer-advertise=http://$(POD_IP):7070, -storage=postgres, -migrate=false, -auth=jwt, -agents=/etc/yanshi/agents,
            -businesslines=/etc/yanshi/businesslines, -pricing=/etc/yanshi/pricing/pricing.yaml, -blob=s3, -notify-shards=16]
          resources:
            requests: {cpu: 500m, memory: 512Mi}
          volumeMounts:
            - {name: docker, mountPath: /var/run/docker.sock}
      volumes:
        - name: docker
          hostPath: {path: /var/run/docker.sock, type: Socket}
