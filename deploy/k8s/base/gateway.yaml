# gateway：HTTP API、Connection（WebSocket）、SSE、Call 中转与 peer 服务（ADR-0013）。
# 按连接数、握手速率与 Call 并发扩缩（yanshi_nodes_connected、yanshi_handshakes_rejected_total）。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: yanshi-gateway
spec:
  replicas: 3
  selector:
    matchLabels: {app.kubernetes.io/name: yanshi, app.kubernetes.io/component: gateway}
  template:
    metadata:
      labels: {app.kubernetes.io/name: yanshi, app.kubernetes.io/component: gateway}
    spec:
      containers:
        - name: yanshi
          image: yanshi
          args: [serve, -roles=gateway, -addr=0.0.0.0:8080, -peer-addr=0.0.0.0:7070, -peer-advertise=http://$(POD_IP):7070,
            -storage=postgres, -migrate=false, -auth=jwt, -agents=/etc/yanshi/agents, -businesslines=/etc/yanshi/businesslines,
            -pricing=/etc/yanshi/pricing/pricing.yaml, -blob=s3, -notify-shards=16]
          ports:
            - {name: http, containerPort: 8080}
          resources:
            requests: {cpu: "1", memory: 1Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: yanshi-gateway
spec:
  selector: {app.kubernetes.io/name: yanshi, app.kubernetes.io/component: gateway}
  ports:
    - {name: http, port: 80, targetPort: http}
---
# 限制同时下线的网关数：网关下线时其上的长连接一齐重连（握手限速与带抖动的 Retry-After 在网关内）。
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: yanshi-gateway
spec:
  maxUnavailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: yanshi, app.kubernetes.io/component: gateway}
