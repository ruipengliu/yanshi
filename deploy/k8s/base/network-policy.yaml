# 网络策略（ADR-0001）：入站只允许入口进入网关，内部地址（peer、指标、探针）只在单元内互通；出站只允许 DNS、
# 单元内与数据库、对象存储所在网段，以及经出口网关访问的三类外联（模型、内容安全、推送）。网段与出口网关因
# 环境而异，由 overlay 修补。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: yanshi-default
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: yanshi}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: yanshi}
      ports:
        - {port: 7070}
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: ingress-nginx}
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: monitoring}
      ports:
        - {port: 8080}
        - {port: 7070}
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: yanshi}
      ports:
        - {port: 7070}
    # PostgreSQL（PgBouncer 与直连）、对象存储、出口网关：overlay 中改为实际网段。
    - to:
        - ipBlock: {cidr: 10.0.0.0/8}
      ports:
        - {port: 5432}
        - {port: 6432}
        - {port: 443}
        - {port: 8333}
