# 通用助手。model 使用 "provider/model" 引用：
#   tokenhub/<模型ID>       腾讯云 TokenHub（需 TOKENHUB_API_KEY）
#   ark/<模型ID或接入点ID>  火山方舟（需 ARK_API_KEY；coding plan 另设
#                          ARK_BASE_URL=https://ark.cn-beijing.volces.com/api/coding/v3）
#   local/<模型名>          私有化 OpenAI 兼容推理服务（需 YANSHI_LOCAL_BASE_URL）
#   echo/any               离线复述，无需任何外部服务
# capabilities 中 "device:<glob>" 表示用户设备上名称匹配的能力（docs/design/m1-device-nodes.md §5），
# "sandbox:<glob>" 表示本会话云端沙箱中的能力（docs/design/m2-sandbox.md，需 serve -sandbox docker）。
name: assistant
version: "1"
model: tokenhub/deepseek-v4.1-flash
instructions: |
  你是一个乐于助人的助手，可以使用用户设备上的能力。回答简洁准确。
  需要当前时间时调用 clock_now。设备离线时调用会等待其上线，请告知用户。
  需要计算、数据处理或画图时，在云端沙箱中用 run_python 编写并运行代码；文件保存在 /workspace。
  大文件不要整体读入对话：分段读取，或导入沙箱处理后只返回结论。
  对以后的对话有用的用户信息（偏好、人际关系、长期事项），用 memory_save 记住；用户要求忘记时用 memory_forget。
  要操作的对象有多个候选而用户没有指明时，用 ask_user 让用户选择；其余情况不要停下来提问，按合理假设完成并说明假设。
capabilities:
  - clock_now
  - ask_user
  - memory_save
  - memory_forget
  - memory_search
  - device:*
  - sandbox:*
max_turns: 100
# call 配置全双工语音通话（docs/design/m3-call.md）：model 是实时语音模型（volc/<模型版本>，需
# VOLC_SPEECH_API_KEY），voice 是音色。语音模型只负责对话，需要做事时经 run_task 交给本 Agent 的 Run。
call:
  model: volc/1.2.6.1
  voice: zh_female_vv_jupiter_bigtts
  instructions: |
    你是用户的语音助手，正在和用户语音通话。说话简短、自然、口语化，一次说一两句，不要念列表或符号。
    你自己只会聊天：看不到用户的文件和设备，不知道现在的时间，通话结束后什么也记不住。凡是需要实际去做的事，都用 run_task 交给后台助手，包括：看或改用户电脑、手机上的文件，查资料，计算，以及用户让你记住、记下的任何事（偏好、健康状况、人际关系、日程）。
    交给后台助手之前，不要说"记住了""看过了"这类话，也不要编造结果；后台助手的结果回来后，用自己的话简短转述，结果还在进行时告诉用户你在处理。
# memory.recall 是每个 Run 开始时召回的 Memory 条数（docs/design/m4-memory-grant.md §3）。
memory:
  recall: 8
# context 控制上下文压缩（docs/design/m2-long-runs.md §4）。
context:
  window: 128000   # 保守取值：实测窗口不小于 200k，压缩早一些只会更省
  compact_at: 0.75
  keep_recent: 16000
  max_tool_result: 8000
