[project]
name = "yanshi-loop"
version = "0.1.0"
description = "yanshi 外部循环的参考适配（ADR-0062 第 8 条、ADR-0063）：LangGraph 与 Pydantic AI"
requires-python = ">=3.12"
dependencies = [
    "starlette",
    "uvicorn",
    "langgraph",
    "langchain-openai",
    "pydantic-ai-slim[openai]",
]

[project.scripts]
yanshi-loop = "yanshi_loop.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yanshi_loop"]
