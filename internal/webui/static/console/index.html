<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>yanshi 调试控制台</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🪡</text></svg>"
    />
    <link rel="stylesheet" href="/console/console.css" />
  </head>
  <body>
    <header id="top"></header>

    <!-- 对话：一台设备全屏展示聊天（docs/design/console.md §2） -->
    <main id="view-chat" class="view chat-layout" hidden>
      <aside id="chat-side" class="sidebar"></aside>
      <div id="chat-main" class="chat-main"></div>
      <aside id="drawer" class="drawer" hidden></aside>
    </main>

    <!-- 设备：每台模拟设备的状态、应用、能力与调用（§3） -->
    <main id="view-devices" class="view" hidden>
      <div id="devices-main" class="devices-main"></div>
    </main>

    <!-- 控制台：时间线、事件、帧、状态、故障注入、指标、验证（§4） -->
    <main id="view-console" class="view" hidden>
      <div id="console-main" class="console-main"></div>
    </main>

    <dialog id="settings"></dialog>
    <div id="toasts"></div>
    <script type="module" src="/console/app.js"></script>
  </body>
</html>
