# 开发依赖（PostgreSQL、S3 兼容对象存储）。启动：make deps-up；停止：make deps-down。
services:
  postgres:
    # 带 pgvector 扩展的 PostgreSQL 16（Memory 的向量检索，docs/design/m4-memory-grant.md §5）。
    image: pgvector/pgvector:pg16
    # pg_stat_statements 用于性能分析（scripts/bench.sh 输出每类查询的次数与耗时）。
    command: postgres -c shared_preload_libraries=pg_stat_statements -c pg_stat_statements.track=all
    environment:
      POSTGRES_USER: yanshi
      POSTGRES_PASSWORD: yanshi
      POSTGRES_DB: yanshi
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - pgdata-pg16:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yanshi -d yanshi"]
      interval: 2s
      timeout: 3s
      retries: 30
  # S3 兼容对象存储（ADR-0011）：开发环境用 SeaweedFS，生产可替换为任何 S3 兼容实现。
  s3:
    image: chrislusf/seaweedfs:3.80
    command: server -s3 -s3.config=/etc/seaweedfs/s3.json -dir=/data -master.volumeSizeLimitMB=64 -volume.max=50
    ports:
      - "127.0.0.1:58333:8333"
    volumes:
      - ./deploy/dev/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
      - s3data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/status || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  pgdata-pg16:
  s3data:
