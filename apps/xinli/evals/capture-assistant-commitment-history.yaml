name: capture-assistant-commitment-history
description: 助手找到已完成的成本核算表，按说话时间说明两次改期和依据，区分相似承诺。
agent: xinli-assistant
setup:
  xinli:
    commitments:
      - id: C-0001
        kind: mine
        content: 绿源成本核算表
        counterpart: 张总
        due_date: "2026-10-23"
        spoken_at: 2026-10-19T09:00:00+08:00
        revisions:
          - op: revise
            author: xinli-day
            session: seed_day_20
            spoken_at: 2026-10-20T10:00:00+08:00
            recorded_at: 2026-10-20T11:00:00+08:00
            fields: {due_date: "2026-10-26"}
            refs: ["#2.0"]
            reason: 张总同意等供应商数据，原话说改到周一。
          - op: revise
            author: xinli-project
            spoken_at: 2026-10-21T14:00:00+08:00
            recorded_at: 2026-10-21T18:00:00+08:00
            fields: {due_date: "2026-10-28"}
            exchanges: [x2026-10-21]
            reason: 项目交谈摘要记载审核多需两天，改到周三。
          - op: close
            author: user
            recorded_at: 2026-10-27T16:00:00+08:00
            fields: {status: done}
            reason: 用户本人确认已经交付。
      - {id: C-0002, kind: mine, content: 康宁成本核算表, counterpart: 王工, due_date: "2026-10-30"}
turns:
  - input: 绿源成本核算表的期限前后怎么变的？
    expect:
      calls: [mcp_xinli__list_commitments, mcp_xinli__commitment_history]
      reply_contains: ["23", "26", "28", 完成]
      reply_excludes: ["30"]
      judge: >-
        5 分：明确绿源成本核算表最初期限 10 月 23 日；10 月 20 日因等供应商数据从 23 日改到 26 日；10 月 21 日因审核多需两天从 26 日改到 28 日；共两次改期，目前已完成。
        区分说话时间和记录时间：10 月 27 日是用户确认完成的记录日，不能据此断言实际交付在 27 日；第一次改期依据原话，第二次依据项目交谈摘要，不混入康宁核算表。
        不假称初始记录有原话，不伪造已过保留期的引文；未被问来源时，不要求主动复述“预置”或逐项声明保留期。
        4 分：23→26→28、两次改期原因及当前完成都正确，未混入康宁，允许遗漏具体改期发生日或未主动标注依据类型。
        把新建算作改期、把确认记录日断言为实际交付日、期限错或混淆原话与摘要，至多 3 分。3 分：顺序正确但漏一个原因或完成状态；2 分：只报最终期限、漏改期或混入康宁期限；1 分：大部分错误或编造。
